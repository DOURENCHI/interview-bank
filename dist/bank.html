ml","html":"<h2>题目</h2>\n<pre><code>import torch\ncell = torch.nn.RNNCell(4, 5)\nh = torch.zeros(2, 5)\nshapes = []\nfor _ in range(3):\n    h = cell(torch.randn(2, 4), h)\n    shapes.append(tuple(h.shape))\nprint(shapes)</code></pre>\n<ul><li><strong>A.</strong> [(2, 5), (2, 5), (2, 5)]</li><li><strong>B.</strong> [(2, 4), (2, 4), (2, 4)]</li><li><strong>C.</strong> [(2, 6), (2, 6), (2, 6)]</li><li><strong>D.</strong> [(5, 2), (5, 2), (5, 2)]</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. [(2, 5), (2, 5), (2, 5)]</strong>，实际输出 <code>[(2, 5), (2, 5), (2, 5)]</code>。</p>\n<p>RNNCell 一次处理一个时间步，输入 (批, 输入特征4)、隐状态 (批, 隐层5)，输出隐状态形状恒为 (2,5)。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 08 CNN 与 RNN</p>","plain":"## 题目\n\n```python\nimport torch\ncell = torch.nn.RNNCell(4, 5)\nh = torch.zeros(2, 5)\nshapes = []\nfor _ in range(3):\n    h = cell(torch.randn(2, 4), h)\n    shapes.append(tuple(h.shape))\nprint(shapes)\n```\n\n- **A.** [(2, 5), (2, 5), (2, 5)]\n- **B.** [(2, 4), (2, 4), (2, 4)]\n- **C.** [(2, 6), (2, 6), (2, 6)]\n- **D.** [(5, 2), (5, 2), (5, 2)]\n\n## 口述答案\n\n答案是 **A. [(2, 5), (2, 5), (2, 5)]**，实际输出 `[(2, 5), (2, 5), (2, 5)]`。\n\nRNNCell 一次处理一个时间步，输入 (批, 输入特征4)、隐状态 (批, 隐层5)，输出隐状态形状恒为 (2,5)。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 08 CNN 与 RNN"},{"id":"Q-1793","title":"这段 Python 代码输出什么？（08 CNN 与 RNN · 第 99 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\n \nbn(torch.randn(4, 3))\nbn.eval()\nprint(tuple(bn(torch.randn(4, 3)).shape))\n```\n\n- **A.** (4, 3)\n- **B.** ((4, 1),)\n- **C.** ((1, 3),)\n- **D.** ((4, 3), (4, 3))\n\n## 口述答案\n\n答案是 **A. (4, 3)**，实际输出 `(4, 3)`。\n\nBatchNorm1d 保持形状不变，只做归一化；train 模式用当前批统计量，eval 模式用运行均值方差。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 08 CNN 与 RNN"},{"id":"Q-1796","title":"这段 Python 代码输出什么？（08 CNN 与 RNN · 第 102 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nclass Res(nn.Module):\n    def __init__(self, c):\n        super().__init__()\n        self.c1 = nn.Conv2d(c, c, 3, padding=1)\n        self.c2 = nn.Conv2d(c, c, 3, padding=1)\n    def forward(self, x):\n        return x + self.c2(F.relu(self.c1(x)))\nprint(tuple(Res(8)(torch.randn(1, 8, 16, 16)).shape))</code></pre>\n<ul><li><strong>A.</strong> (1, 8, 16, 16)</li><li><strong>B.</strong> ((1, 16, 16, 16),)</li><li><strong>C.</strong> ((1, 8, 14, 14),)</li><li><strong>D.</strong> ((1, 8, 8, 8),)</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. (1, 8, 16, 16)</strong>，实际输出 <code>(1, 8, 16, 16)</code>。</p>\n<p>padding=1 保持空间尺寸，残差相加要求形状一致，所以残差块进出形状完全相同——这是残差能「深下去」的前提。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 08 CNN 与 RNN</p>","plain":"## 题目\n\n```python\nimport torch\nimport torch.nn as nn\nimport torch.nn.functional as F\nclass Res(nn.Module):\n    def __init__(self, c):\n        super().__init__()\n        self.c1 = nn.Conv2d(c, c, 3, padding=1)\n        self.c2 = nn.Conv2d(c, c, 3, padding=1)\n    def forward(self, x):\n        return x + self.c2(F.relu(self.c1(x)))\nprint(tuple(Res(8)(torch.randn(1, 8, 16, 16)).shape))\n```\n\n- **A.** (1, 8, 16, 16)\n- **B.** ((1, 16, 16, 16),)\n- **C.** ((1, 8, 14, 14),)\n- **D.** ((1, 8, 8, 8),)\n\n## 口述答案\n\n答案是 **A. (1, 8, 16, 16)**，实际输出 `(1, 8, 16, 16)`。\n\npadding=1 保持空间尺寸，残差相加要求形状一致，所以残差块进出形状完全相同——这是残差能「深下去」的前提。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 08 CNN 与 RNN"},{"id":"Q-1797","title":"这段 Python 代码输出什么？（08 CNN 与 RNN · 第 103 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\nemb = torch.nn.Embedding(100, 16)\nprint(tuple(emb(torch.tensor([1, 2, 3])).shape), emb.weight.shape)</code></pre>\n<ul><li><strong>A.</strong> (3, 16) torch.Size([100, 16])</li><li><strong>B.</strong> ((100, 16), torch.Size([100, 16]))</li><li><strong>C.</strong> ((3, 100), torch.Size([100, 16]))</li><li><strong>D.</strong> ((16, 3), torch.Size([100, 16]))</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. (3, 16) torch.Size([100, 16])</strong>，实际输出 <code>(3, 16) torch.Size([100, 16])</code>。</p>\n<p>Embedding 把 3 个下标各查成 16 维向量，输出 (3,16)；权重表是 (词表100, 维度16)。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 08 CNN 与 RNN</p>","plain":"## 题目\n\n```python\nimport torch\nemb = torch.nn.Embedding(100, 16)\nprint(tuple(emb(to \n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1800","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 106 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\nm = torch.nn.Linear(2, 1)\nopt = torch.optim.Adam(m.parameters(), lr=0.01)\nm(torch.randn(4, 2)).sum().backward()\nopt.step()\nprint(tuple(opt.state[m.weight].keys()))</code></pre>\n<ul><li><strong>A.</strong> ('step', 'exp_avg', 'exp_avg_sq')</li><li><strong>B.</strong> ('exp_avg',)</li><li><strong>C.</strong> ('step',)</li><li><strong>D.</strong> ()</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. ('step', 'exp_avg', 'exp_avg_sq')</strong>，实际输出 <code>('step', 'exp_avg', 'exp_avg_sq')</code>。</p>\n<p>Adam 为每个参数维护步数、一阶动量和二阶动量三个状态，这是它比 SGD 收敛快的原因。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\nm = torch.nn.Linear(2, 1)\nopt = torch.optim.Adam(m.parameters(), lr=0.01)\nm(torch.randn(4, 2)).sum().backward()\nopt.step()\nprint(tuple(opt.state[m.weight].keys()))\n```\n\n- **A.** ('step', 'exp_avg', 'exp_avg_sq')\n- **B.** ('exp_avg',)\n- **C.** ('step',)\n- **D.** ()\n\n## 口述答案\n\n答案是 **A. ('step', 'exp_avg', 'exp_avg_sq')**，实际输出 `('step', 'exp_avg', 'exp_avg_sq')`。\n\nAdam 为每个参数维护步数、一阶动量和二阶动量三个状态，这是它比 SGD 收敛快的原因。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1801","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 107 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\ntorch.manual_seed(9)\nm = torch.nn.Linear(1, 1)\nopt = torch.optim.SGD(m.parameters(), lr=1e4)\nxs = torch.Tensor([[1.0], [2.0], [3.0]])\nys = torch.Tensor([[2.0], [4.0], [6.0]])\ncrit = torch.nn.MSELoss(reduction=&quot;sum&quot;)\nfirst = None\nfor _ in range(5):\n    loss = crit(m(xs), ys)\n    opt.zero_grad()\n    loss.backward()\n    opt.step()\n    if first is None:\n        first = loss.item()\nprint(round(first, 4), round(loss.item(), 4), loss.item() &gt; first)</code></pre>\n<ul><li><strong>A.</strong> 48.404 inf True</li><li><strong>B.</strong> (48.404, 0.0, False)</li><li><strong>C.</strong> (0.0, 48.404, True)</li><li><strong>D.</strong> (48.404, 48.404, False)</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 48.404 inf True</strong>，实际输出 <code>48.404 inf True</code>。</p>\n<p>学习率 1e4 太大，一步就冲过头，损失变成 inf（溢出）。看到 inf/nan 先怀疑学习率。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\ntorch.manual_seed(9)\nm = torch.nn.Linear(1, 1)\nopt = torch.optim.SGD(m.parameters(), lr=1e4)\nxs = torch.Tensor([[1.0], [2.0], [3.0]])\nys = torch.Tensor([[2.0], [4.0], [6.0]])\ncrit = torch.nn.MSELoss(reduction=\"sum\")\nfirst = None\nfor _ in range(5):\n    loss = crit(m(xs), ys)\n    opt.zero_grad()\n    loss.backward()\n    opt.step()\n    if first is None:\n        first = loss.item()\nprint(round(first, 4), round(loss.item(), 4), loss.item() > first)\n```\n\n- **A.** 48.404 inf True\n- **B.** (48.404, 0.0, False)\n- **C.** (0.0, 48.404, True)\n- **D.** (48.404, 48.404, False)\n\n## 口述答案\n\n答案是 **A. 48.404 inf True**，实际输出 `48.404 inf True`。\n\n学习率 1e4 太大，一步就冲过头，损失变成 inf（溢出）。看到 inf/nan 先怀疑学习率。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1802","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 108 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\nm = torch.nn.Linear(2, 1)\nprint(m.weight_decay if hasattr(m, &quot;weight_decay&quot;) else &quot;n/a&quot;)</code></pre>\n<ul><li><strong>A.</strong> n/a</li><li><strong>B.</strong> 0.01</li><li><strong>C.</strong> 0.0</li><li><strong>D.</strong> 1e-4</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. n/a</strong>，实际输出 <code>n/a</code>。</p>\n<p>weight_decay 是优化器的参数不是层的参数，所以 Linear 上没有这个属性——要写在 torch.optim.SGD(..., weight_decay=...) 里。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\nm = torch.nn.Linear(2, 1)\nprint(m.weight_decay if hasattr(m, \"weight_decay\") else \"n/a\")\n```\n\n- **A.** n/a\n- **B.** 0.01\n- **C.** 0.0\n- **D.** 1e-4\n\n## 口述答案\n\n答案是 **A. n/a**，实际输出 `n/a`。\n\nweight_decay 是优化器的参数不是层的参数，所以 Linear 上没有这个属性——要写在 torch.optim.SGD(..., weight_decay=...) 里。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1803","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 109 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\ntorch.manual_seed(10)\nd = torch.nn.Dropout(0.5)\nd.train()\nout = d(torch.ones(1000))\nprint(round(float((out == 0).float().mean()), 4))</code></pre>\n<ul><li><strong>A.</strong> 0.499</li><li><strong>B.</strong> 0.5,</li><li><strong>C.</strong> 0.999</li><li><strong>D.</strong> 0.0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 0.499</strong>，实际输出 <code>0.499</code>。</p>\n<p>Dropout 在 train 模式按 p=0.5 随机置零，实测 1000 个里有 499 个是 0，接近 0.5。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\ntorch.manual_seed(10)\nd = torch.nn.Dropout(0.5)\nd.train()\nout = d(torch.ones(1000))\nprint(round(float((out == 0).float().mean()), 4))\n```\n\n- **A.** 0.499\n- **B.** 0.5, \n- **C.** 0.999\n- **D.** 0.0\n\n## 口述答案\n\n答案是 **A. 0.499**，实际输出 `0.499`。\n\nDropout 在 train 模式按 p=0.5 随机置零，实测 1000 个里有 499 个是 0，接近 0.5。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1804","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 110 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\ntorch.manual_seed(10)\nd = torch.nn.Dropout(0.5)\nd.eval()\nprint(round(float(d(torch.ones(10)).sum()), 4))</code></pre>\n<ul><li><strong>A.</strong> 10.0</li><li><strong>B.</strong> 0.0</li><li><strong>C.</strong> 5.0</li><li><strong>D.</strong> 1.0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 10.0</strong>，实际输出 <code>10.0</code>。</p>\n<p>eval 模式关闭 Dropout，10 个 1 原样通过，和是 10.0。推理时忘了 model.eval() 是最常见的线上事故。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\ntorch.manual_seed(10)\nd = torch.nn.Dropout(0.5)\nd.eval()\nprint(round(float(d(torch.ones(10)).sum()), 4))\n```\n\n- **A.** 10.0\n- **B.** 0.0\n- **C.** 5.0\n- **D.** 1.0\n\n## 口述答案\n\n答案是 **A. 10.0**，实际输出 `10.0`。\n\neval 模式关闭 Dropout，10 个 1 原样通过，和是 10.0。推理时忘了 model.eval() 是最常见的线上事故。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1805","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 111 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\ntorch.manual_seed(11)\nm = torch.nn.Linear(2, 1)\nsd = {k: v.clone() for k, v in m.state_dict().items()}\nm(torch.randn(2, 2)).sum().backward()\nm2 = torch.nn.Linear(2, 1)\nm2.load_state_dict(sd)\nprint(tuple(m.state_dict().keys()), bool(torch.equal(m.weight, m2.weight)), bool(torch.equal(m.bias, m2.bias)))</code></pre>\n<ul><li><strong>A.</strong> ('weight', 'bias') True True</li><li><strong>B.</strong> ('weight', 'bias') False True</li><li><strong>C.</strong> ('param',) True True</li><li><strong>D.</strong> ('weight', 'bias') True False</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. ('weight', 'bias') True True</strong>，实际输出 <code>('weight', 'bias') True True</code>。</p>\n<p>state_dict 是有序字典，键为 weight/bias；load_state_dict 把保存的值装回新模型，两个布尔都为 True。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\ntorch.manual_seed(11)\nm = torch.nn.Linear(2, 1)\nsd = {k: v.clone() for k, v in m.state_dict().items()}\nm(torch.randn(2, 2)).sum().backward()\nm2 = torch.nn.Linear(2, 1)\nm2.load_state_dict(sd)\nprint(tuple(m.state_dict().keys()), bool(torch.equal(m.weight, m2.weight)), bool(torch.equal(m.bias, m2.bias)))\n```\n\n- **A.** ('weight', 'bias') True True\n- **B.** ('weight', 'bias') False True\n- **C.** ('param',) True True\n- **D.** ('weight', 'bias') True False\n\n## 口述答案\n\n答案是 **A. ('weight', 'bias') True True**，实际输出 `('weight', 'bias') True True`。\n\nstate_dict 是有序字典，键为 weight/bias；load_state_dict 把保存的值装回新模型，两个布尔都为 True。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1806","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 112 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch, tempfile, os\ntorch.manual_seed(12)\nm = torch.nn.Linear(3, 2)\npath = os.path.join(tempfile.gettempdir(), &quot;_lab_state.pt&quot;)\ntorch.save(m.state_dict(), path)\nm2 = torch.nn.Linear(3, 2)\nm2.load_state_dict(torch.load(path, weights_only=True))\nos.remove(path)\nprint(bool(torch.equal(m.weight, m2.weight)), tuple(m.weight.shape))</code></pre>\n<ul><li><strong>A.</strong> True (2, 3)</li><li><strong>B.</strong> (False, (2, 3))</li><li><strong>C.</strong> (True, (3, 2))</li><li><strong>D.</strong> (True, (6,))</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. True (2, 3)</strong>，实际输出 <code>True (2, 3)</code>。</p>\n<p>存的是 state_dict（不是整个模型），所以新模型结构必须一致才能 load；weight 形状 (out=2, in=3)。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch, tempfile, os\ntorch.manual_seed(12)\nm = torch.nn.Linear(3, 2)\npath = os.path.join(tempfile.gettempdir(), \"_lab_state.pt\")\ntorch.save(m.state_dict(), path)\nm2 = torch.nn.Linear(3, 2)\nm2.load_state_dict(torch.load(path, weights_only=True))\nos.remove(path)\nprint(bool(torch.equal(m.weight, m2.weight)), tuple(m.weight.shape))\n```\n\n- **A.** True (2, 3)\n- **B.** (False, (2, 3))\n- **C.** (True, (3, 2))\n- **D.** (True, (6,))\n\n## 口述答案\n\n答案是 **A. True (2, 3)**，实际输出 `True (2, 3)`。\n\n存的是 state_dict（不是整个模型），所以新模型结构必须一致才能 load；weight 形状 (out=2, in=3)。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1807","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 113 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\nprint(torch.device(&quot;cpu&quot;), torch.zeros(2).device)</code></pre>\n<ul><li><strong>A.</strong> cpu cpu</li><li><strong>B.</strong> cpu:0 cpu:0</li><li><strong>C.</strong> cuda:0 cuda:0</li><li><strong>D.</strong> None None</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. cpu cpu</strong>，实际输出 <code>cpu cpu</code>。</p>\n<p>本机是 CPU 版 PyTorch，device 就是 cpu；装了 CUDA 版才会出现 cuda:0。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\nprint(torch.device(\"cpu\"), torch.zeros(2).device)\n```\n\n- **A.** cpu cpu\n- **B.** cpu:0 cpu:0\n- **C.** cuda:0 cuda:0\n- **D.** None None\n\n## 口述答案\n\n答案是 **A. cpu cpu**，实际输出 `cpu cpu`。\n\n本机是 CPU 版 PyTorch，device 就是 cpu；装了 CUDA 版才会出现 cuda:0。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1808","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 114 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\nm = torch.nn.Linear(2, 1)\nwith torch.inference_mode():\n    out = m(torch.ones(1, 2))\nprint(out.requires_grad)</code></pre>\n<ul><li><strong>A.</strong> False</li><li><strong>B.</strong> True</li><li><strong>C.</strong> None</li><li><strong>D.</strong> 0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. False</strong>，实际输出 <code>False</code>。</p>\n<p>inference_mode 比 no_grad 更彻底，连版本计数都不记，推理首选；no_grad 也能达到不建图的效果。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\nm = torch.nn.Linear(2, 1)\nwith torch.inference_mode():\n    out = m(torch.ones(1, 2))\nprint(out.requires_grad)\n```\n\n- **A.** False\n- **B.** True\n- **C.** None\n- **D.** 0\n\n## 口述答案\n\n答案是 **A. False**，实际输出 `False`。\n\ninference_mode 比 no_grad 更彻底，连版本计数都不记，推理首选；no_grad 也能达到不建图的效果。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1809","title":"这段 Python 代码输出什么？（09 优化、正则化与工程化 · 第 115 题）","module":"04_algo","moduleName":"算法机考","sub":"Python语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<pre><code>import torch\ntorch.manual_seed(13)\na = torch.randn(3).tolist()\ntorch.manual_seed(13)\nb = torch.randn(3).tolist()\nprint(a == b, [round(v, 6) for v in a])</code></pre>\n<ul><li><strong>A.</strong> True [-0.111659, -1.14561, 1.410316]</li><li><strong>B.</strong> (False, [-0.111659, -1.14561, 1.410316])</li><li><strong>C.</strong> (True, [0.111659, 1.14561, -1.410316])</li><li><strong>D.</strong> (False, [0.0, 0.0, 0.0])</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. True [-0.111659, -1.14561, 1.410316]</strong>，实际输出 <code>True [-0.111659, -1.14561, 1.410316]</code>。</p>\n<p>固定 seed 后随机序列完全可复现，所以两次结果完全相等。不固定 seed 就没法复现 bug。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n```python\nimport torch\ntorch.manual_seed(13)\na = torch.randn(3).tolist()\ntorch.manual_seed(13)\nb = torch.randn(3).tolist()\nprint(a == b, [round(v, 6) for v in a])\n```\n\n- **A.** True [-0.111659, -1.14561, 1.410316]\n- **B.** (False, [-0.111659, -1.14561, 1.410316])\n- **C.** (True, [0.111659, 1.14561, -1.410316])\n- **D.** (False, [0.0, 0.0, 0.0])\n\n## 口述答案\n\n答案是 **A. True [-0.111659, -1.14561, 1.410316]**，实际输出 `True [-0.111659, -1.14561, 1.410316]`。\n\n固定 seed 后随机序列完全可复现，所以两次结果完全相等。不固定 seed 就没法复现 bug。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1810","title":"语言地基自测：类型、容器、作用域 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>import sys\n\n\ndef show(label, value):\n    print(f&quot;{label} = {value}&quot;)\n\n\nshow(&quot;type(3)&quot;, type(3))\nshow(&quot;type(3.0)&quot;, type(3.0))\nshow(&quot;7 // 2, 7 / 2, -7 // 2&quot;, (7 // 2, 7 / 2, -7 // 2))\nshow(&quot;7 % 3, -7 % 3&quot;, (7 % 3, -7 % 3))\nshow(&quot;round(2.675, 2)&quot;, round(2.675, 2))\nshow(&quot;[1,2,3][1:4]&quot;, [1, 2, 3][1:4])\nshow(&quot;[1,2,3][::-1]&quot;, [1, 2, 3][::-1])\n\na = [3, 1, 2]\nprint(&quot;sort() 返回&quot;, a.sort(), &quot;排序后 a =&quot;, a)\nprint(&quot;sorted() 返回&quot;, sorted([3, 1, 2]))\n\ncounter = {&quot;n&quot;: 0}\n\n\ndef bump():\n    counter[&quot;n&quot;] += 1\n    return counter[&quot;n&quot;]\n\n\nprint(&quot;连续调用&quot;, bump(), bump(), &quot;计数器&quot;, counter)\n\nprint(&quot;版本&quot;, sys.version.split()[0])</code></pre>\n<p>输出样例：</p>\n<pre><code>type(3) = &lt;class &#x27;int&#x27;&gt;\ntype(3.0) = &lt;class &#x27;float&#x27;&gt;\n7 // 2, 7 / 2, -7 // 2 = (3, 3.5, -4)\n7 % 3, -7 % 3 = (1, 2)\nround(2.675, 2) = 2.67\n[1,2,3][1:4] = [2, 3]\n[1,2,3][::-1] = [3, 2, 1]\nsort() 返回 None 排序后 a = [1, 2, 3]\nsorted() 返回 [1, 2, 3]\n连续调用 1 2 计数器 {&#x27;n&#x27;: 2}\n版本 3.13.14</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 01 Python 语言地基</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\nimport sys\n\n\ndef show(label, value):\n    print(f\"{label} = {value}\")\n\n\nshow(\"type(3)\", type(3))\nshow(\"type(3.0)\", type(3.0))\nshow(\"7 // 2, 7 / 2, -7 // 2\", (7 // 2, 7 / 2, -7 // 2))\nshow(\"7 % 3, -7 % 3\", (7 % 3, -7 % 3))\nshow(\"round(2.675, 2)\", round(2.675, 2))\nshow(\"[1,2,3][1:4]\", [1, 2, 3][1:4])\nshow(\"[1,2,3][::-1]\", [1, 2, 3][::-1])\n\na = [3, 1, 2]\nprint(\"sort() 返回\", a.sort(), \"排序后 a =\", a)\nprint(\"sorted() 返回\", sorted([3, 1, 2]))\n\ncounter = {\"n\": 0}\n\n\ndef bump():\n    counter[\"n\"] += 1\n    return counter[\"n\"]\n\n\nprint(\"连续调用\", bump(), bump(), \"计数器\", counter)\n\nprint(\"版本\", sys.version.split()[0])\n```\n\n输出样例：\n\n```\ntype(3) =  \ntype(3.0) =  \n7 // 2, 7 / 2, -7 // 2 = (3, 3.5, -4)\n7 % 3, -7 % 3 = (1, 2)\nround(2.675, 2) = 2.67\n[1,2,3][1:4] = [2, 3]\n[1,2,3][::-1] = [3, 2, 1]\nsort() 返回 None 排序后 a = [1, 2, 3]\nsorted() 返回 [1, 2, 3]\n连续调用 1 2 计数器 {'n': 2}\n版本 3.13.14\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 01 Python 语言地基"},{"id":"Q-1811","title":"NumPy 形状、广播与聚合 的 ACM 输入输出怎么写？","module nprint(\"shape\", a.shape, \"ndim\", a.ndim, \"size\", a.size, \"dtype\", a.dtype)\nprint(\"a[0,1]\", a[0, 1], \"| a[1]\", a[1], \"| a[:,0]\", a[:, 0])\nprint(\"T.shape\", a.T.shape, \"| reshape(4).shape\", a.reshape(4).shape)\nprint(\"sum\", a.sum(), \"| axis=0\", a.sum(axis=0), \"| axis=1\", a.sum(axis=1))\nprint(\"argmax\", np.argmax([1, 9, 3]), \"argmin\", np.argmin([4, 2, 8]))\nprint(\"广播 b+c 形状\", (b + c).shape)\nprint(\"逐元素乘 c*b\", (c * b).tolist())\nprint(\"round/clip\", np.round(np.array([3.7, -2.2, 5.0]), 1).tolist(),\n      np.clip(np.array([3.7, -2.2, 5.0]), -2, 4).tolist())\n```\n\n输出样例：\n\n```\nshape (2, 2) ndim 2 size 4 dtype int64\na[0,1] 2 | a[1] [3 4] | a[:,0] [1 3]\nT.shape (2, 2) | reshape(4).shape (4,)\nsum 10 | axis=0 [4 6] | axis=1 [3 7]\nargmax 1 argmin 1\n广播 b+c 形状 (2, 3)\n逐元素乘 c*b [[1, 4, 9], [4, 10, 18]]\nround/clip [3.7, -2.2, 5.0] [3.7, -2.0, 4.0]\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 02 NumPy 与张量基础"},{"id":"Q-1812","title":"autograd：梯度、累加与 no_grad 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>import torch\n\nx = torch.tensor([1.0, 2.0, 3.0], requires_grad=True)\nz = x * 2\nloss = (z - 3).pow(2).sum()\nloss.backward()\nprint(&quot;x.grad =&quot;, x.grad.tolist())\n\ny = torch.tensor([2.0], requires_grad=True)\n(y * 3).sum().backward()\n(y * 5).sum().backward()\nprint(&quot;两次 backward 后 y.grad =&quot;, y.grad.tolist(), &quot;（梯度累加）&quot;)\n\nm = torch.tensor([1.0], requires_grad=True)\nwith torch.no_grad():\n    n = m * 2\nprint(&quot;no_grad 下 requires_grad =&quot;, n.requires_grad)\n\nt = torch.tensor([1.0, 2.0])\nprint(&quot;item() =&quot;, t.sum().item(), &quot;| 直接 print =&quot;, t.sum())</code></pre>\n<p>输出样例：</p>\n<pre><code>x.grad = [-4.0, 4.0, 12.0]\n两次 backward 后 y.grad = [8.0] （梯度累加）\nno_grad 下 requires_grad = False\nitem() = 3.0 | 直接 print = tensor(3.)</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 03 autograd 与计算图</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\nimport torch\n\nx = torch.tensor([1.0, 2.0, 3.0], requires_grad=True)\nz = x * 2\nloss = (z - 3).pow(2).sum()\nloss.backward()\nprint(\"x.grad =\", x.grad.tolist())\n\ny = torch.tensor([2.0], requires_grad=True)\n(y * 3).sum().backward()\n(y * 5).sum().backward()\nprint(\"两次 backward 后 y.grad =\", y.grad.tolist(), \"（梯度累加）\")\n\nm = torch.tensor([1.0], requires_grad=True)\nwith torch.no_grad():\n    n = m * 2\nprint(\"no_grad 下 requires_grad =\", n.requires_grad)\n\nt = torch.tensor([1.0, 2.0])\nprint(\"item() =\", t.sum().item(), \"| 直接 print =\", t.sum())\n```\n\n输出样例：\n\n```\nx.grad = [-4.0, 4.0, 12.0]\n两次 backward 后 y.grad = [8.0] （梯度累加）\nno_grad 下 requires_grad = False\nitem() = 3.0 | 直接 print = tensor(3.)\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 03 autograd 与计算图"},{"id":"Q-1813","title":"手写梯度下降：w 一步步走向 2.0 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>xs = [1.0, 2.0, 3.0]\nys = [2.0, 4.0, 6.0]\n\n\ndef cost(w):\n    return sum((x * w - y) ** 2 for x, y in zip(xs, ys)) / len(xs)\n\n\ndef grad(w):\n    return sum(2 * x * (x * w - y) for x, y in zip(xs, ys)) / len(xs)\n\n\nw = 1.0\nprint(f&quot;初始 w={w:.4f} cost={cost(w):.4f} grad={grad(w):.4f}&quot;)\nfor step in range(100):\n    g = grad(w)\n    w -= 0.01 * g\n    if step &lt; 3 or step % 25 == 0:\n        print(f&quot;Epoch {step}: w={w:.4f} cost={cost(w):.4f}&quot;)\nprint(f&quot;最终 w={w:.4f}（真实值 2.0）&quot;)</code></pre>\n<p>输出样例：</p>\n<pre><code>初始 w=1.0000 cost=4.6667 grad=-9.3333\nEpoch 0: w=1.0933 cost=3.8362\nEpoch 1: w=1.1780 cost=3.1535\nEpoch 2: w=1.2547 cost=2.5923\nEpoch 25: w=1.9217 cost=0.0286\nEpoch 50: w=1.9932 cost=0.0002\nEpoch 75: w=1.9994 cost=0.0000\n最终 w=1.9999（真实值 2.0）</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 04 线性模型与梯度下降</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\nxs = [1.0, 2.0, 3.0]\nys = [2.0, 4.0, 6.0]\n\n\ndef cost(w):\n    return sum((x * w - y) ** 2 for x, y in zip(xs, ys)) / len(xs)\n\n\ndef grad(w):\n    return sum(2 * x * (x * w - y) for x, y in zip(xs, ys)) / len(xs)\n\n\nw = 1.0\nprint(f\"初始 w={w:.4f} cost={cost(w):.4f} grad={grad(w):.4f}\")\nfor step in range(100):\n    g = grad(w)\n    w -= 0.01 * g\n    if step < 3 or step % 25 == 0:\n        print(f\"Epoch {step}: w={w:.4f} cost={cost(w):.4f}\")\nprint(f\"最终 w={w:.4f}（真实值 2.0）\")\n```\n\n输出样例：\n\n```\n初始 w=1.0000 cost=4.6667 grad=-9.3333\nEpoch 0: w=1.0933 cost=3.8362\nEpoch 1: w=1.1780 cost=3.1535\nEpoch 2: w=1.2547 cost=2.5923\nEpoch 25: w=1.9217 cost=0.0286\nEpoch 50: w=1.9932 cost=0.0002\nEpoch 75: w=1.9994 cost=0.0000\n最终 w=1.9999（真实值 2.0）\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 04 线性模型与梯度下降"},{"id":"Q-1814","title":"PyTorch 版线性回归：完整训练循环 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>import torch\n\ntorch.manual_seed(1)\n\nx_data = torch.Tensor([[1.0], [2.0], [3.0]])\ny_data = torch.Tensor([[2.0], [4.0], [6.0]])\n\n\nclass LinearModel(torch.nn.Module):\n    def __init__(self):\n        super(LinearModel, self).__init__()\n        self.linear = torch.nn.Linear(1, 1)\n\n    def forward(self, x):\n        return self.linear(x)\n\n\nmodel = LinearModel()\ncriterion = torch.nn.MSELoss(reduction=&quot;sum&quot;)\noptimizer = torch.optim.SGD(model.parameters(), lr=0.01)\n\nfor epoch in range(100):\n    y_pred = model(x_data)\n    loss = criterion(y_pred, y_data)\n    optimizer.zero_grad()\n    loss.backward()\n    optimizer.step()\n    if epoch % 20 == 0:\n        print(f&quot;Epoch {epoch}: loss={loss.item():.4f}&quot;)\n\nprint(&quot;w =&quot;, round(model.linear.weight.item(), 4))\nprint(&quot;b =&quot;, round(model.linear.bias.item(), 4))\nprint(&quot;predict 4h =&quot;, round(model(torch.Tensor([[4.0]])).item(), 4))</code></pre>\n<p>输出样例：</p>\n<pre><code>Epoch 0: loss=39.3106\nEpoch 20: loss=0.0101\nEpoch 40: loss=0.0076\nEpoch 60: loss=0.0057\nEpoch 80: loss=0.0043\nw = 1.9622\nb = 0.086\npredict 4h = 7.9346</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 04 线性模型与梯度下降</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\nimport torch\n\ntorch.manual_seed(1)\n\nx_data = torch.Tensor([[1.0], [2.0], [3.0]])\ny_data = torch.Tensor([[2.0], [4.0], [6.0]])\n\n\nclass LinearModel(torch.nn.Module):\n    def __init__(self):\n        super(LinearModel, self).__init__()\n        self.linear = torch.nn.Linear(1, 1)\n\n    def forward(self, x):\n        return self.linear(x)\n\n\nmodel = LinearModel()\ncriterion = torch.nn.MSELoss(reduction=\"sum\")\noptimizer = torch.optim.SGD(model.parameters(), lr=0.01)\n\nfor epoch in range(100):\n    y_pred = model(x_data)\n    loss = criterion(y_pred, y_data)\n    optimizer.zero_grad()\n    loss.backward()\n    optimizer.step()\n    if epoch % 20 == 0:\n        print(f\"Epoch {epoch}: loss={loss.item():.4f}\")\n\nprint(\"w =\", round(model.linear.weight.item(), 4))\nprint(\"b =\", round(model.linear.bias.item(), 4))\nprint(\"predict 4h =\", round(model(torch.Tensor([[4.0]])).item(), 4))\n```\n\n输出样例：\n\n```\nEpoch 0: loss=39.3106\nEpoch 20: loss=0.0101\nEpoch 40: loss=0.0076\nEpoch 60: loss=0.0057\nEpoch 80: loss=0.0043\nw = 1.9622\nb = 0.086\npredict 4h = 7.9346\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 04 线性模型与梯度下降"},{"id":"Q-1815","title":"nn.Module：参数量、冻结与 train/eval 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>import torch\nimport torch.nn as nn\n\ntorch.manual_seed(3)\n\nm = nn.Linear(3, 2)\nprint(&quot;weight&quot;, tuple(m.weight.shape), &quot;bias&quot;, tuple(m.bias.shape))\nprint(&quot;参数量&quot;, sum(p.num 量 8\nSequential 参数量 49\n前向输出形状 (4, 1)\n冻结后仍有可训练参数吗 False\ntrain 模式输出和 3.4002 | eval 模式输出和 1.4552\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 05 nn.Module 与训练循环"},{"id":"Q-1816","title":"自定义 Dataset 与 DataLoader 分批 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>import torch\nfrom torch.utils.data import Dataset, DataLoader\n\n\nclass ToyDataset(Dataset):\n    def __init__(self, n):\n        self.x = torch.arange(n, dtype=torch.float32).reshape(-1, 1)\n        self.y = self.x * 2\n\n    def __len__(self):\n        return len(self.x)\n\n    def __getitem__(self, i):\n        return self.x[i], self.y[i]\n\n\nds = ToyDataset(10)\ndl = DataLoader(ds, batch_size=4, shuffle=False)\nprint(&quot;样本数&quot;, len(ds), &quot;批数&quot;, len(dl))\nfor xb, yb in dl:\n    print(&quot;x&quot;, xb.reshape(-1).tolist(), &quot;y&quot;, yb.reshape(-1).tolist())\n\nprint(&quot;drop_last=True 后批数&quot;, len(DataLoader(ds, batch_size=4, drop_last=True)))\n\ntorch.manual_seed(0)\nseen = []\nfor xb, _ in DataLoader(ds, batch_size=2, shuffle=True):\n    seen.extend(xb.reshape(-1).tolist())\nprint(&quot;shuffle 后顺序&quot;, seen)</code></pre>\n<p>输出样例：</p>\n<pre><code>样本数 10 批数 3\nx [0.0, 1.0, 2.0, 3.0] y [0.0, 2.0, 4.0, 6.0]\nx [4.0, 5.0, 6.0, 7.0] y [8.0, 10.0, 12.0, 14.0]\nx [8.0, 9.0] y [16.0, 18.0]\ndrop_last=True 后批数 2\nshuffle 后顺序 [6.0, 7.0, 1.0, 4.0, 2.0, 0.0, 9.0, 8.0, 3.0, 5.0]</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p 040 -&gt; 末轮 inf（发散）</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\nimport torch\nimport torch.nn as nn\n\ntorch.manual_seed(1)\nm = torch.nn.Linear(2, 1)\nsgd = torch.optim.SGD(m.parameters(), lr=0.1, momentum=0.9)\nprint(\"SGD 超参 lr =\", sgd.param_groups[0][\"lr\"], \"momentum =\", sgd.param_groups[0][\"momentum\"])\n\nadam = torch.optim.Adam(m.parameters(), lr=0.01)\nm(torch.randn(4, 2)).sum().backward()\nadam.step()\nprint(\"Adam 状态键\", tuple(adam.state[m.weight].keys()))\n\nm(torch.ones(1, 2)).sum().backward()\ng = float(m.weight.grad.sum())\nm.zero_grad()\nprint(\"清零前梯度\", round(g, 6), \"| 清零后\", m.weight.grad)\n\ntorch.manual_seed(9)\nbig = torch.nn.Linear(1, 1)\nopt = torch.optim.SGD(big.parameters(), lr=1e4)\nxs = torch.Tensor([[1.0], [2.0], [3.0]])\nys = torch.Tensor([[2.0], [4.0], [6.0]])\ncrit = nn.MSELoss(reduction=\"sum\")\nfirst = None\nfor _ in range(5):\n    loss = crit(big(xs), ys)\n    opt.zero_grad()\n    loss.backward()\n    opt.step()\n    if first is None:\n        first = loss.item()\nprint(f\"lr=1e4 首轮 loss {first:.4f} -> 末轮 {loss.item():.4f}（发散）\")\n```\n\n输出样例：\n\n```\nSGD 超参 lr = 0.1 momentum = 0.9\nAdam 状态键 ('step', 'exp_avg', 'exp_avg_sq')\n清零前梯度 0.769743 | 清零后 None\nlr=1e4 首轮 loss 48.4040 -> 末轮 inf（发散）\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1821","title":"权重存取与可复现性 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"], () 后  [1, 2, 3, 4, 5, 6]\n原数组未被修改 [5, 2, 4, 6, 1, 3]\nsorted 关键字参数 [3, 2, 1]\nsorted 带下标 [(1, &#x27;a&#x27;), (2, &#x27;b&#x27;)]</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\ndef insertion_sort(a):\n    a = list(a)\n    for i in range(1, len(a)):\n        key = a[i]\n        j = i - 1\n        while j >= 0 and a[j] > key:\n            a[j + 1] = a[j]\n            j -= 1\n        a[j + 1] = key\n    return a\n\n\ndata = [5, 2, 4, 6, 1, 3]\nprint(\"原数组      \", data)\nprint(\"插入排序后  \", insertion_sort(data))\nprint(\"sorted() 后 \", sorted(data))\nprint(\"原数组未被修改\", data)\n\nprint(\"sorted 关键字参数\", sorted([3, 1, 2], key=lambda x: -x))\nprint(\"sorted 带下标\", sorted([(2, \"b\"), (1, \"a\")], key=lambda p: p[0]))\n```\n\n输出样例：\n\n```\n原数组       [5, 2, 4, 6, 1, 3]\n插入排序后   [1, 2, 3, 4, 5, 6]\nsorted() 后  [1, 2, 3, 4, 5, 6]\n原数组未被修改 [5, 2, 4, 6, 1, 3]\nsorted 关键字参数 [3, 2, 1]\nsorted 带下标 [(1, 'a'), (2, 'b')]\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1825","title":"端到端：训练 + 评估 + 存权重一条龙 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"Python ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["Python","ACM","输入输出","机考"],"sourceRef":"教学文档/Python实验台/Python考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 Python 程序对应的读入与输出写法是什么？</p>\n<pre><code>import os\nimport tempfile\n\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import DataLoader, Dataset\n\n\nclass Toy(Dataset):\n    def __init__(self, n):\n        self.x = torch.arange(n, dtype=torch.float32).reshape(-1, 1) / n\n        self.y = self.x * 2\n\n    def __len__(self):\n        return len(self.x)\n\n    def __getitem__(self, i):\n        return self.x[i], self.y[i]\n\n\ntorch.manual_seed(7)\nmodel = nn.Linear(1, 1)\nopt = torch.optim.Adam(model.parameters(), lr=0.05)\ncrit = nn.MSELoss()\ndl = DataLoader(Toy(64), batch_size=16, shuffle=True)\n\nmodel.train()\nfor epoch in range(30):\n    total = 0.0\n    for xb, yb in dl:\n        opt.zero_grad()\n        loss = crit(model(xb), yb)\n        loss.backward()\n        opt.step()\n        total += loss.item()\n    if epoch % 10 == 0:\n        print(f&quot;Epoch {epoch}: 平均损失 {total / len(dl):.5f}&quot;)\n\nmodel.eval()\nwith torch.inference_mode():\n    preds = model(torch.tensor([[0.5]]))\nprint(&quot;eval 预测 x=0.5 -&gt;&quot;, round(float(preds), 4), &quot;（真实值 1.0）&quot;)\n\npath = os.path.join(tempfile.gettempdir(), &quot;_py_lab_e2e.pt&quot;)\ntorch.save(model.state_dict(), path)\nprint(&quot;权重已保存，字节数&quot;, os.path.getsize(path))\nos.remove(path)</code></pre>\n<p>输出样例：</p>\n<pre><code>Epoch 0: 平均损失 2.37330\nEpoch 10: 平均损失 0.08115\nEpoch 20: 平均损失 0.02413\neval 预测 x=0.5 -&gt; 1.0126 （真实值 1.0）\n权重已保存，字节数 1925</code></pre>\n<h2>口述答案</h2>\n<p>待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。</p>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无。</p>\n<h2>来源</h2>\n<p><code>教学文档/Python实验台/Python考点实验台.html</code> · 09 优化、正则化与工程化</p>","plain":"## 题目\n\n机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。\n下面这段 Python 程序对应的读入与输出写法是什么？\n\n```python\nimport os\nimport tempfile\n\nimport torch\nimport torch.nn as nn\nfrom torch.utils.data import DataLoader, Dataset\n\n\nclass Toy(Dataset):\n    def __init__(self, n):\n        self.x = torch.arange(n, dtype=torch.float32).reshape(-1, 1) / n\n        self.y = self.x * 2\n\n    def __len__(self):\n        return len(self.x)\n\n    def __getitem__(self, i):\n        return self.x[i], self.y[i]\n\n\ntorch.manual_seed(7)\nmodel = nn.Linear(1, 1)\nopt = torch.optim.Adam(model.parameters(), lr=0.05)\ncrit = nn.MSELoss()\ndl = DataLoader(Toy(64), batch_size=16, shuffle=True)\n\nmodel.train()\nfor epoch in range(30):\n    total = 0.0\n    for xb, yb in dl:\n        opt.zero_grad()\n        loss = crit(model(xb), yb)\n        loss.backward()\n        opt.step()\n        total += loss.item()\n    if epoch % 10 == 0:\n        print(f\"Epoch {epoch}: 平均损失 {total / len(dl):.5f}\")\n\nmodel.eval()\nwith torch.inference_mode():\n    preds = model(torch.tensor([[0.5]]))\nprint(\"eval 预测 x=0.5 ->\", round(float(preds), 4), \"（真实值 1.0）\")\n\npath = os.path.join(tempfile.gettempdir(), \"_py_lab_e2e.pt\")\ntorch.save(model.state_dict(), path)\nprint(\"权重已保存，字节数\", os.path.getsize(path))\nos.remove(path)\n```\n\n输出样例：\n\n```\nEpoch 0: 平均损失 2.37330\nEpoch 10: 平均损失 0.08115\nEpoch 20: 平均损失 0.02413\neval 预测 x=0.5 -> 1.0126 （真实值 1.0）\n权重已保存，字节数 1925\n```\n\n## 口述答案\n\n待补充。重点说清三件事：怎么读到不定长输入、怎么处理行尾、怎么保证输出格式一字不差。\n\n## 讲深一层\n\n待补充。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无。\n\n## 来源\n\n`教学文档/Python实验台/Python考点实验台.html` · 09 优化、正则化与工程化"},{"id":"Q-1826","title":"两数之和：为什么一遍哈希就够了，不用双重循环？","module":"04_algo","moduleName":"算法机考","sub":"数组哈希","priority":"P0","difficulty":1,"status":"indexed","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["哈希","数组"],"sourceRef":"按华为机考题型分布推导，题名对照 LeetCode","html":"<h2>口述答案</h2>\n<blockquote>待补充。这题要能边说边写：先说思路和复杂度，再写代码，最后主动说边界。</blockquote>\n<p><strong>套路</strong>：边遍历边存「还差多少→下标」，当前值一命中就返回。O(n) 时间换 O(n) 空间，比 O(n²) 稳。</p>\n<h2>讲深一层</h2>\n<p>待补充。补三件事：为什么这个套路成立、复杂度怎么算、和哪道题是同一模板。</p>\n<h2>高频追问</h2>\n<p>待补充。常见追问方向：换数据规模怎么办、能不能做到 O(1) 空间、有负数还成立吗。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（算法题）。刷的时候用 LeetCode 按题名搜，别背题号。</p>\n<h2>来源</h2>\n<p>按华为机考题型分布推导（数组/字符串/哈希 40%、双指针滑窗 20%、DFS/BFS 20%、DP 20%）</p>","plain":"## 口述答案\n\n> 待补充。这题要能边说边写：先说思路和复杂度，再写代码，最后主动说边界。\n\n**套路**：边遍历边存「还差多少→下标」，当前值一命中就返 const WRONG_KEY = 'ib_wrong_v1';
const OPEN_ALL = location.hash === '#all';   // 调试用：全部展开
let wrong = new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]'));

const $ = id => document.getElementById(id);
const list = $('list');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function card(q){
  const isW = wrong.has(q.id);
  const st = q.status === 'indexed' ? '<span class="tag">待补充</span>' : '';
  return `<article class="q" data-id="${q.id}">
    <div class="qh">
      <span class="pid">${q.id}</span>
      <span class="pri ${q.priority}">${q.priority}</span>
      <div class="qt">${esc(q.title)}</div>
      <span class="tag">${esc(q.moduleName)}</span>
      ${st}
      <button class="wrongmark ${isW?'on':''}" data-w="${q.id}">${isW?'已标错':'标错'}</button>
    </div>
    <div class="body">${q.html}</div>
  </article>`;
}

function render(){
  const kw = $('q').value.trim().toLowerCase();
  const mod = $('mod').value, pri = $('pri').value, st = $('st').value;
  const onlyW = $('wrong').checked;
  const hit = DATA.filter(q => {
    if (mod && q.module !== mod) return false;
    if (pri && q.priority !== pri) return false;
    if (st && q.status !== st) return false;
    if (onlyW && !wrong.has(q.id)) return false;
    if (!kw) return true;
    const hay = (q.title + ' ' + q.id + ' ' + q.tags.join(' ') +
                 ' ' + q.sub + ' ' + q.plain).toLowerCase();
    return hay.includes(kw);
  });
  list.innerHTML = hit.map(card).join('');
  $('empty').style.display = hit.length ? 'none' : 'block';
  // 搜索/筛选时自动展开，省一次点击
  if (kw || mod || pri || st || onlyW || OPEN_ALL) {
    list.querySelectorAll('.q').forEach(el => el.classList.add('open'));
  }
  $('stat').textContent = `共 ${DATA.length} 题 ｜ 当前 ${hit.length} 题 ｜ `
    + `已答 ${DATA.filter(q=>q.status!=='indexed').length} ｜ 错题 ${wrong.size}`;
}

list.addEventListener('click', e => {
  const wb = e.target.closest('[data-w]');
  if (wb) {
    const id = wb.dataset.w;
    wrong.has(id) ? wrong.delete(id) : wrong.add(id);
    localStorage.setItem(WRONG_KEY, JSON.stringify([...wrong]));
    wb.classList.toggle('on');
    wb.textContent = wrong.has(id) ? '已标错' : '标错';
    $('stat').textContent = $('stat').textContent.replace(/错题 \d+/, '错题 ' + wrong.size);
    return;
  }
  const head = e.target.closest('.qh');
  if (head) head.parentElement.classList.toggle('open');
});

['q','mod','pri','st','wrong'].forEach(id => $(id).addEventListener('input', render));
render();
</script>
