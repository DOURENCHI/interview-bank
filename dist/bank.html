<script>
const DATA = [{"id":"Q-0101","title":"介绍一下你的本科毕设","module":"01_project","moduleName":"项目深挖","sub":"4G道路测温","priority":"P0","difficulty":2,"status":"answered","qtype":"project","roles":["嵌入式","感知"],"companies":["亿嘉和","华为车BU"],"tags":["毕设","DHT11","STM32","4G","传感器","链路"],"sourceRef":"方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf","html":"<h2>口述答案</h2>\n<blockquote>我的毕设是「基于 4G 通信的道路温度获取方法」，一句话说就是把路面温度采上来、用 4G 发到云端、能在网页上看曲线。整条链路分四层：测量是 DHT11 贴地测温，主控是 STM32F103，通信是 4G Cat.1 的 DTU 走 RS485，最后到云端做展示和曲线分析。我做的工作量不在「采一个温度」，而在把这条链路打通并且可控——DHT11 是单总线，时序要求严，我用寄存器配 GPIO 做输入输出切换，采样时关中断防误码； DTU 那层我封了一个 AT 指令收发函数，发出去之后必须在超时窗口里匹配到期望应答才算成功。落地结论是：链路可行性验证通过，但 DHT11 量程只到 50℃，夏季沥青路面能到 60℃ 以上，这是这个方案明确的短板。</blockquote>\n<h2>讲深一层</h2>\n<p>四层职责划分（面试官问\"哪些是你写的\"就按这层讲）：</p>\n<table><thead><tr><th>层</th><th>承担什么</th><th>关键点</th></tr></thead><tbody><tr><td>驱动层</td><td>DHT11 单总线时序、UART / RS485 收发</td><td>微秒级延时、GPIO 方向切换、关中断</td></tr><tr><td>模块层</td><td>DTU 初始化与 AT 指令交互</td><td>应答匹配 + 超时判据</td></tr><tr><td>业务层</td><td>采集 → 解析 → 组帧 → 发送</td><td>帧格式、校验</td></tr><tr><td>应用层</td><td>云端接收、数据展示与曲线</td><td>时间戳依赖 RTC</td></tr></tbody></table>\n<p>链路串起来是：DHT11 → GPIO → STM32 解析 → 组帧 → RS485 → DTU → 4G → 云。</p>\n<h2>高频追问</h2>\n<ol><li><strong>为什么用 RS485 不用 TTL 串口？</strong> —— 差分传输抗共模干扰，传输距离可达千米级，设备装在车上或野外走长线更稳。</li><li><strong>Cat.1 和 NB-IoT 怎么选？</strong> —— Cat.1 上下行约 5 / 10 Mbps，适合小数据量但要有一定实时性；NB-IoT 只有百 kbps 级，超低功耗广覆盖，适合抄表这类不需要实时的场景。</li><li><strong>系统怎么确认真的连上云了？</strong> —— DTU 注册到云后服务器会回固定一帧注册包 <code>0xAF 0x20 0x7E 0x00 0x01 0x5A</code>，用它作为判据，而不是「发出去了应该成了」。</li><li><strong>你的 RTC 为什么单接纽扣电池？</strong> —— 主电源掉电时维持 RTC 走时和后备寄存器，重启后时间戳不用重设，采集系统没有时间戳等于数据废掉。</li></ol>\n<h2>易错点</h2>\n<ul><li>❌ 说「DHT11 是红外测温传感器」 —— 论文里自己笔误过一处，面试说错是硬伤</li><li>✅ 说「复合式数字温湿度传感器：电阻式湿敏元件 + NTC 测温元件，内部集成 8 位单片机做校准和数字输出」</li><li>❌ 只讲「采集-上传-显示」不讲难点 —— 听起来像课程实验</li><li>✅ 一定要带出「时序严 + 超时判据 + 量程短板」这三件真事</li></ul>\n<h2>关联项目</h2>\n<ul><li><code>方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf</code></li><li><code>方向与规划/项目/毕设/4G道路温度采集_项目包</code></li></ul>\n<h2>来源</h2>\n<p>本人本科毕设（2026）</p>","plain":"## 口述答案\n\n> 我的毕设是「基于 4G 通信的道路温度获取方法」，一句话说就是把路面温度采上来、\n> 用 4G 发到云端、能在网页上看曲线。整条链路分四层：测量是 DHT11 贴地测温，\n> 主控是 STM32F103，通信是 4G Cat.1 的 DTU 走 RS485，最后到云端做展示和曲线分析。\n> 我做的工作量不在「采一个温度」，而在把这条链路打通并且可控——DHT11 是单总线，\n> 时序要求严，我用寄存器配 GPIO 做输入输出切换，采样时关中断防误码；\n> DTU 那层我封了一个 AT 指令收发函数，发出去之后必须在超时窗口里匹配到期望应答才算成功。\n> 落地结论是：链路可行性验证通过，但 DHT11 量程只到 50℃，夏季沥青路面能到 60℃ 以上，\n> 这是这个方案明确的短板。\n\n## 讲深一层\n\n四层职责划分（面试官问\"哪些是你写的\"就按这层讲）：\n\n| 层 | 承担什么 | 关键点 |\n|---|---|---|\n| 驱动层 | DHT11 单总线时序、UART / RS485 收发 | 微秒级延时、GPIO 方向切换、关中断 |\n| 模块层 | DTU 初始化与 AT 指令交互 | 应答匹配 + 超时判据 |\n| 业务层 | 采集 → 解析 → 组帧 → 发送 | 帧格式、校验 |\n| 应用层 | 云端接收、数据展示与曲线 | 时间戳依赖 RTC |\n\n链路串起来是：DHT11 → GPIO → STM32 解析 → 组帧 → RS485 → DTU → 4G → 云。\n\n## 高频追问\n\n1. **为什么用 RS485 不用 TTL 串口？** —— 差分传输抗共模干扰，传输距离可达千米级，设备装在车上或野外走长线更稳。\n2. **Cat.1 和 NB-IoT 怎么选？** —— Cat.1 上下行约 5 / 10 Mbps，适合小数据量但要有一定实时性；NB-IoT 只有百 kbps 级，超低功耗广覆盖，适合抄表这类不需要实时的场景。\n3. **系统怎么确认真的连上云了？** —— DTU 注册到云后服务器会回固定一帧注册包 `0xAF 0x20 0x7E 0x00 0x01 0x5A`，用它作为判据，而不是「发出去了应该成了」。\n4. **你的 RTC 为什么单接纽扣电池？** —— 主电源掉电时维持 RTC 走时和后备寄存器，重启后时间戳不用重设，采集系统没有时间戳等于数据废掉。\n\n## 易错点\n\n- ❌ 说「DHT11 是红外测温传感器」 —— 论文里自己笔误过一处，面试说错是硬伤\n- ✅ 说「复合式数字温湿度传感器：电阻式湿敏元件 + NTC 测温元件，内部集成 8 位单片机做校准和数字输出」\n- ❌ 只讲「采集-上传-显示」不讲难点 —— 听起来像课程实验\n- ✅ 一定要带出「时序严 + 超时判据 + 量程短板」这三件真事\n\n## 关联项目\n\n- `方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf`\n- `方向与规划/项目/毕设/4G道路温度采集_项目包`\n\n## 来源\n\n本人本科毕设（2026）"},{"id":"Q-0102","title":"DHT11 的驱动难点在哪？","module":"01_project","moduleName":"项目深挖","sub":"4G道路测温","priority":"P0","difficulty":3,"status":"answered","qtype":"project","roles":["嵌入式"],"companies":["亿嘉和"],"tags":["DHT11","单总线","时序","GPIO","中断"],"sourceRef":"方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf","html":"<h2>口述答案</h2>\n<blockquote>难点不是读 GPIO，而是准确测出高电平持续了多久。DHT11 一次传 40 位，每一位的 0 和 1 是靠高电平宽度区分的——大约 26 微秒是 0，70 微秒是 1。所以三件事决定驱动稳不稳：微秒级延时的精度、GPIO 在输入和输出之间切换的时机、以及中断会不会打断采样。我的做法是同一个 GPIO 动态切方向，改的是 <code>GPIOG-&gt;CRH</code> 的配置位；读的时候关中断，因为一旦被中断打断，脉宽就测错，整帧数据就废了。而校验和只能告诉你错了，不能告诉你错在哪一位。</blockquote>\n<h2>讲深一层</h2>\n<p>完整时序：</p>\n<table><thead><tr><th>阶段</th><th>时长</th><th>说明</th></tr></thead><tbody><tr><td>主机起始</td><td>拉低 ≥18ms</td><td>唤醒从机</td></tr><tr><td>主机释放</td><td>20–40µs</td><td>切为输入，等响应</td></tr><tr><td>从机响应</td><td>80µs 低 + 80µs 高</td><td>握手成功标志</td></tr><tr><td>数据位 × 40</td><td>每位以 50µs 低电平起始</td><td>高电平 ~26µs = 0，~70µs = 1</td></tr></tbody></table>\n<p>数据格式 40 位 = 5 字节：</p>\n<table><thead><tr><th>字节</th><th>内容</th></tr></thead><tbody><tr><td>1</td><td>湿度整数</td></tr><tr><td>2</td><td>湿度小数（DHT11 恒为 0）</td></tr><tr><td>3</td><td>温度整数</td></tr><tr><td>4</td><td>温度小数（恒为 0）</td></tr><tr><td>5</td><td>校验和 = 前 4 字节相加取低 8 位</td></tr></tbody></table>\n<p>分辨率就是 1℃ / 1%RH，小数位是没有意义的。</p>\n<h2>高频追问</h2>\n<ol><li><strong>为什么必须关中断？</strong> —— 采样窗口是微秒级，中断进出本身的耗时加上服务程序，足以让脉宽判错；错一位整帧作废。</li><li><strong>校验和怎么算？</strong> —— 前四字节相加取低 8 位，与第五字节比较，不等就丢弃重读。</li><li><strong>为什么不能只靠校验和保证正确？</strong> —— 它只能发现错，定位不了错在哪一位；真正的保障是时序精度。</li><li><strong>不上拉电阻行不行？</strong> —— 单总线是开漏结构，没有上拉就没有明确的高电平，读出来全是错的。</li></ol>\n<h2>易错点</h2>\n<ul><li>❌ 「DHT11 精度 ±0.5℃」 —— 实际是 ±2℃</li><li>✅ 记住官方规格：温度 0–50℃ ±2℃、湿度 20–90%RH ±5%RH、响应时间 6s 量级</li><li>❌ 说「就是延时读一下电平」 —— 完全没体现工程难点</li><li>✅ 落到「延时精度 / 方向切换时机 / 中断干扰」这三件事上</li></ul>\n<h2>关联项目</h2>\n<ul><li><code>方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf</code> §5.1、§5.4</li></ul>\n<h2>来源</h2>\n<p>本人本科毕设 + DHT11 数据手册</p>","plain":"## 口述答案\n\n> 难点不是读 GPIO，而是准确测出高电平持续了多久。DHT11 一次传 40 位，\n> 每一位的 0 和 1 是靠高电平宽度区分的——大约 26 微秒是 0，70 微秒是 1。\n> 所以三件事决定驱动稳不稳：微秒级延时的精度、GPIO 在输入和输出之间切换的时机、\n> 以及中断会不会打断采样。我的做法是同一个 GPIO 动态切方向，改的是 `GPIOG->CRH`\n> 的配置位；读的时候关中断，因为一旦被中断打断，脉宽就测错，整帧数据就废了。\n> 而校验和只能告诉你错了，不能告诉你错在哪一位。\n\n## 讲深一层\n\n完整时序：\n\n| 阶段 | 时长 | 说明 |\n|---|---|---|\n| 主机起始 | 拉低 ≥18ms | 唤醒从机 |\n| 主机释放 | 20–40µs | 切为输入，等响应 |\n| 从机响应 | 80µs 低 + 80µs 高 | 握手成功标志 |\n| 数据位 × 40 | 每位以 50µs 低电平起始 | 高电平 ~26µs = 0，~70µs = 1 |\n\n数据格式 40 位 = 5 字节：\n\n| 字节 | 内容 |\n|---|---|\n| 1 | 湿度整数 |\n| 2 | 湿度小数（DHT11 恒为 0） |\n| 3 | 温度整数 |\n| 4 | 温度小数（恒为 0） |\n| 5 | 校验和 = 前 4 字节相加取低 8 位 |\n\n分辨率就是 1℃ / 1%RH，小数位是没有意义的。\n\n## 高频追问\n\n1. **为什么必须关中断？** —— 采样窗口是微秒级，中断进出本身的耗时加上服务程序，足以让脉宽判错；错一位整帧作废。\n2. **校验和怎么算？** —— 前四字节相加取低 8 位，与第五字节比较，不等就丢弃重读。\n3. **为什么不能只靠校验和保证正确？** —— 它只能发现错，定位不了错在哪一位；真正的保障是时序精度。\n4. **不上拉电阻行不行？** —— 单总线是开漏结构，没有上拉就没有明确的高电平，读出来全是错的。\n\n## 易错点\n\n- ❌ 「DHT11 精度 ±0.5℃」 —— 实际是 ±2℃\n- ✅ 记住官方规格：温度 0–50℃ ±2℃、湿度 20–90%RH ±5%RH、响应时间 6s 量级\n- ❌ 说「就是延时读一下电平」 —— 完全没体现工程难点\n- ✅ 落到「延时精度 / 方向切换时机 / 中断干扰」这三件事上\n\n## 关联项目\n\n- `方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf` §5.1、§5.4\n\n## 来源\n\n本人本科毕设 + DHT11 数据手册"},{"id":"Q-0103","title":"你这个方案的局限是什么？为什么用 DHT11 而不是红外测温？","module":"01_project","moduleName":"项目深挖","sub":"4G道路测温","priority":"P0","difficulty":3,"status":"answered","qtype":"project","roles":["嵌入式","感知"],"companies":["亿嘉和","华为车BU"],"tags":["DHT11","红外测温","量程","方案取舍","局限"],"sourceRef":"方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf","html":"<h2>口述答案</h2>\n<blockquote>这是我这个设计最明确的局限，我绪论里分析过两类路面测温方式：接触式要埋设、会破坏路面；非接触红外精度高但成本上去了。本科阶段的可控条件下，我选了 DHT11 做近地表接触测量，把项目重心放在验证「采集—4G—云端」这条链路的可行性上，而不是做一个精度达标的测温仪器。所以论文题目是「获取方法」，落脚点是链路可行性，这一点我在结论里也写明了。如果要继续做，路径是清楚的：换成红外测温模块或埋热电偶，补上标准仪器比对来量化误差，并且解决 50℃ 以上的量程问题。</blockquote>\n<h2>讲深一层</h2>\n<p>三种路面测温方式对比：</p>\n<table><thead><tr><th>方式</th><th>代表器件</th><th>精度</th><th>成本</th><th>主要问题</th></tr></thead><tbody><tr><td>接触式（本方案）</td><td>DHT11</td><td>±2℃</td><td>极低</td><td><strong>量程 0–50℃，超了直接测不了</strong>；需近地表安装</td></tr><tr><td>非接触红外</td><td>红外测温模块</td><td>较高</td><td>中高</td><td>受发射率、环境辐射影响，要标定</td></tr><tr><td>埋入式</td><td>热电偶</td><td>高</td><td>中</td><td>需埋设，破坏路面，施工成本高</td></tr></tbody></table>\n<p>关键矛盾：<strong>夏季沥青路面可到 60℃ 以上，已超出 DHT11 的 0–50℃ 量程</strong>。这不是精度问题，是测不到。</p>\n<h2>高频追问</h2>\n<ol><li><strong>那你这数据能用来干嘛？</strong> —— 诚实的答法：能做趋势观测和链路验证，不能做标定级测量。别硬吹。</li><li><strong>如果给你三个月改进，你先做什么？</strong> —— 先解决量程（换红外或热电偶），再做标准仪器比对量化误差，最后才谈精度优化。</li><li><strong>为什么不一开始就用红外？</strong> —— 成本 + 标定门槛。本科阶段的可控条件下，先用低成本方案把链路打通，是合理取舍。</li><li><strong>你怎么知道误差有多大？</strong> —— 本方案没有做标准仪器比对，这是局限；正确做法是并排测同一路面，做误差统计。</li></ol>\n<h2>易错点</h2>\n<ul><li>❌ 硬说「精度够用」 —— 面试官一算 60℃ 就超量程，立刻崩</li><li>✅ 主动承认边界 + 给出改进路径，这是加分项不是减分项</li><li>❌ 把「测不到」说成「测得不准」 —— 量程和精度是两个问题</li><li>✅ 分清：0–50℃ 之内误差 ±2℃（精度问题），超过 50℃ 是量程问题（根本测不了）</li></ul>\n<h2>关联项目</h2>\n<ul><li><code>方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf</code> §7</li><li><code>方向与规划/项目/毕设/4G道路温度采集_项目包</code></li></ul>\n<h2>来源</h2>\n<p>本人本科毕设（2026）</p>","plain":"## 口述答案\n\n> 这是我这个设计最明确的局限，我绪论里分析过两类路面测温方式：接触式要埋设、\n> 会破坏路面；非接触红外精度高但成本上去了。本科阶段的可控条件下，我选了 DHT11\n> 做近地表接触测量，把项目重心放在验证「采集—4G—云端」这条链路的可行性上，\n> 而不是做一个精度达标的测温仪器。所以论文题目是「获取方法」，落脚点是链路可行性，\n> 这一点我在结论里也写明了。如果要继续做，路径是清楚的：换成红外测温模块或埋热电偶，\n> 补上标准仪器比对来量化误差，并且解决 50℃ 以上的量程问题。\n\n## 讲深一层\n\n三种路面测温方式对比：\n\n| 方式 | 代表器件 | 精度 | 成本 | 主要问题 |\n|---|---|---|---|---|\n| 接触式（本方案） | DHT11 | ±2℃ | 极低 | **量程 0–50℃，超了直接测不了**；需近地表安装 |\n| 非接触红外 | 红外测温模块 | 较高 | 中高 | 受发射率、环境辐射影响，要标定 |\n| 埋入式 | 热电偶 | 高 | 中 | 需埋设，破坏路面，施工成本高 |\n\n关键矛盾：**夏季沥青路面可到 60℃ 以上，已超出 DHT11 的 0–50℃ 量程**。这不是精度问题，是测不到。\n\n## 高频追问\n\n1. **那你这数据能用来干嘛？** —— 诚实的答法：能做趋势观测和链路验证，不能做标定级测量。别硬吹。\n2. **如果给你三个月改进，你先做什么？** —— 先解决量程（换红外或热电偶），再做标准仪器比对量化误差，最后才谈精度优化。\n3. **为什么不一开始就用红外？** —— 成本 + 标定门槛。本科阶段的可控条件下，先用低成本方案把链路打通，是合理取舍。\n4. **你怎么知道误差有多大？** —— 本方案没有做标准仪器比对，这是局限；正确做法是并排测同一路面，做误差统计。\n\n## 易错点\n\n- ❌ 硬说「精度够用」 —— 面试官一算 60℃ 就超量程，立刻崩\n- ✅ 主动承认边界 + 给出改进路径，这是加分项不是减分项\n- ❌ 把「测不到」说成「测得不准」 —— 量程和精度是两个问题\n- ✅ 分清：0–50℃ 之内误差 ±2℃（精度问题），超过 50℃ 是量程问题（根本测不了）\n\n## 关联项目\n\n- `方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf` §7\n- `方向与规划/项目/毕设/4G道路温度采集_项目包`\n\n## 来源\n\n本人本科毕设（2026）"},{"id":"Q-0104","title":"多边形转矩形框：为什么能转、丢了什么？","module":"01_project","moduleName":"项目深挖","sub":"YOLO部署","priority":"P0","difficulty":2,"status":"indexed","qtype":"principle","roles":[],"companies":[],"tags":[],"sourceRef":"方向与规划/项目/YOLO_Road_Detection/YOLO_Road_Detection_完整手册.html","html":"<h2>口述答案</h2>\n<blockquote>待补充。200–320 字，口语，结构：结论 → 为什么 → 落到\"我做过\"。</blockquote>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>待补充。</p>\n<h2>来源</h2>\n<p><code>方向与规划/项目/YOLO_Road_Detection/YOLO_Road_Detection_完整手册.html</code></p>","plain":"## 口述答案\n\n> 果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int i, c = 0;\nfor (i = 0; i &lt; 10; i += 3) c++;\ncout &lt;&lt; c &lt;&lt; &quot; &quot; &lt;&lt; i;</code></pre>\n<ul><li><strong>A.</strong> 3 9</li><li><strong>B.</strong> 4 10</li><li><strong>C.</strong> 4 12</li><li><strong>D.</strong> 3 12</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>C. 4 12</strong>，实际输出 <code>4 12</code>。</p>\n<p>i 依次取 0、3、6、9，共 4 次；之后 i 变成 12，条件不成立，循环结束。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 05 控制结构</p>","plain":"## 题目\n\n```cpp\nint i, c = 0;\nfor (i = 0; i < 10; i += 3) c++;\ncout << c << \" \" << i;\n```\n\n- **A.** 3 9\n- **B.** 4 10\n- **C.** 4 12\n- **D.** 3 12\n\n## 口述答案\n\n答案是 **C. 4 12**，实际输出 `4 12`。\n\ni 依次取 0、3、6、9，共 4 次；之后 i 变成 12，条件不成立，循环结束。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 05 控制结构"},{"id":"Q-1622","title":"这段 C++ 代码输出什么？（06 数组与字符串 · 第 9 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>char s[] = &quot;hello&quot;;\ncout &lt;&lt; sizeof(s) &lt;&lt; &quot; &quot; &lt;&lt; strlen(s);</code></pre>\n<ul><li><strong>A.</strong> 5 5</li><li><strong>B.</strong> 6 5</li><li><strong>C.</strong> 6 6</li><li><strong>D.</strong> 5 6</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>B. 6 5</strong>，实际输出 <code>6 5</code>。</p>\n<p>sizeof 算整个数组，包括末尾的 '\\0'；strlen 数到 '\\0' 为止。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 06 数组与字符串</p>","plain":"## 题目\n\n```cpp\nchar s[] = \"hello\";\ncout << sizeof(s) << \" \" << strlen(s);\n```\n\n- **A.** 5 5\n- **B.** 6 5\n- **C.** 6 6\n- **D.** 5 6\n\n## 口述答案\n\n答案是 **B. 6 5**，实际输出 `6 5`。\n\nsizeof 算整个数组，包括末尾的 '\\0'；strlen 数到 '\\0' 为止。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 06 数组与字符串"},{"id":"Q-1623","title":"这段 C++ 代码输出什么？（06 数组与字符串 · 第 10 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int a[5] = {1, 2};\ncout &lt;&lt; a[2] + a[4];</code></pre>\n<ul><li><strong>A.</strong> 0</li><li><strong>B.</strong> 随机值</li><li><strong>C.</strong> 3</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 0</strong>，实际输出 <code>0</code>。</p>\n<p>部分初始化时，没给出的元素自动补 0。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 06 数组与字符串</p>","plain":"## 题目\n\n```cpp\nint a[5] = {1, 2};\ncout << a[2] + a[4];\n```\n\n- **A.** 0\n- **B.** 随机值\n- **C.** 3\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. 0**，实际输出 `0`。\n\n部分初始化时，没给出的元素自动补 0。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 06 数组与字符串"},{"id":"Q-1624","title":"这段 C++ 代码输出什么？（07 指针 · 第 11 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int a[] = {1, 2, 3, 4, 5};\nint *p = a + 1;\ncout &lt;&lt; *(p + 2) &lt;&lt; p[-1];</code></pre>\n<ul><li><strong>A.</strong> 41</li><li><strong>B.</strong> 52</li><li><strong>C.</strong> 31</li><li><strong>D.</strong> 42</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 41</strong>，实际输出 <code>41</code>。</p>\n<p>p 指向 a[1]；p + 2 指向 a[3]（值 4）；p[-1] 就是 a[0]（值 1）。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 07 指针</p>","plain":"## 题目\n\n```cpp\nint a[] = {1, 2, 3, 4, 5};\nint *p = a + 1;\ncout << *(p + 2) << p[-1];\n```\n\n- **A.** 41\n- **B.** 52\n- **C.** 31\n- **D.** 42\n\n## 口述答案\n\n答案是 **A. 41**，实际输出 `41`。\n\np 指向 a[1]；p + 2 指向 a[3]（值 4）；p[-1] 就是 a[0]（值 1）。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 07 指针"},{"id":"Q-1625","title":"这段 C++ 代码输出什么？（07 指针 · 第 12 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int a[] = {1, 2, 3};\nint *p = a;\nint x = *p++;\ncout &lt;&lt; x &lt;&lt; *p;</code></pre>\n<ul><li><strong>A.</strong> 12</li><li><strong>B.</strong> 22</li><li><strong>C.</strong> 11</li><li><strong>D.</strong> 21</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 12</strong>，实际输出 <code>12</code>。</p>\n<p>*p++ 等价于 *(p++)：先取 *p 得 1，再让 p 后移到 a[1]。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 07 指针</p>","plain":"## 题目\n\n```cpp\nint a[] = {1, 2, 3};\nint *p = a;\nint x = *p++;\ncout << x << *p;\n```\n\n- **A.** 12\n- **B.** 22\n- **C.** 11\n- **D.** 21\n\n## 口述答案\n\n答案是 **A. 12**，实际输出 `12`。\n\n*p++ 等价于 *(p++)：先取 *p 得 1，再让 p 后移到 a[1]。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 07 指针"},{"id":"Q-1626","title":"这段 C++ 代码输出什么？（07 指针 · 第 13 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int a = 1, b = 2;\nint * const p = &amp;a;\np = &amp;b;\ncout &lt;&lt; *p;</code></pre>\n<ul><li><strong>A.</strong> 编译错误</li><li><strong>B.</strong> 2</li><li><strong>C.</strong> 1</li><li><strong>D.</strong> 运行时崩溃</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 编译错误</strong>，实际输出 <code>编译错误</code>。</p>\n<p>int * const p 是指针常量：p 本身不能改指向。const 在星号右边，锁的是指针。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 07 指针</p>","plain":"## 题目\n\n```cpp\nint a = 1, b = 2;\nint * const p = &a;\np = &b;\ncout << *p;\n```\n\n- **A.** 编译错误\n- **B.** 2\n- **C.** 1\n- **D.** 运行时崩溃\n\n## 口述答案\n\n答案是 **A. 编译错误**，实际输出 `编译错误`。\n\nint * const p 是指针常量：p 本身不能改指向。const 在星号右边，锁的是指针。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 07 指针"},{"id":"Q-1627","title":"这段 C++ 代码输出什么？（08 引用 · 第 14 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>void f(int x, int &amp;y) { x = 9; y = 9; }\nint main() {\n    int a = 1, b = 1;\n    f(a, b);\n    cout &lt;&lt; a &lt;&lt; b;\n}</code></pre>\n<ul><li><strong>A.</strong> 11</li><li><strong>B.</strong> 19</li><li><strong>C.</strong> 91</li><li><strong>D.</strong> 99</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>B. 19</strong>，实际输出 <code>19</code>。</p>\n<p>按值传参改的是副本，a 不变；按引用传参改的就是 b 本身。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 08 引用</p>","plain":"## 题目\n\n```cpp\nvoid f(int x, int &y) { x = 9; y = 9; }\nint main() {\n    int a = 1, b = 1;\n    f(a, b);\n    cout << a << b;\n}\n```\n\n- **A.** 11\n- **B.** 19\n- **C.** 91\n- **D.** 99\n\n## 口述答案\n\n答案是 **B. 19**，实际输出 `19`。\n\n按值传参改的是副本，a 不变；按引用传参改的就是 b 本身。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 08 引用"},{"id":"Q-1628","title":"这段 C++ 代码输出什么？（09 函数 · 第 15 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int f() { static int n = 0; return ++n; }\nint main() {\n    f(); f();\n    cout &lt;&lt; f();\n}</code></pre>\n<ul><li><strong>A.</strong> 1</li><li><strong>B.</strong> 2</li><li><strong>C.</strong> de></pre>\n<ul><li><strong>A.</strong> 编译错误</li><li><strong>B.</strong> 什么都不输出</li><li><strong>C.</strong> 1</li><li><strong>D.</strong> 运行时崩溃</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 编译错误</strong>，实际输出 <code>编译错误</code>。</p>\n<p>class 的成员默认是 private，类外不能访问；改成 struct 就可以。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 11 类与对象</p>","plain":"## 题目\n\n```cpp\nclass A { int x; };\nint main() {\n    A a;\n    a.x = 1;\n}\n```\n\n- **A.** 编译错误\n- **B.** 什么都不输出\n- **C.** 1\n- **D.** 运行时崩溃\n\n## 口述答案\n\n答案是 **A. 编译错误**，实际输出 `编译错误`。\n\nclass 的成员默认是 private，类外不能访问；改成 struct 就可以。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 11 类与对象"},{"id":"Q-1632","title":"这段 C++ 代码输出什么？（12 构造与析构 · 第 19 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>struct T {\n    char c;\n    T(char c) : c(c) { cout &lt;&lt; c; }\n    ~T() { cout &lt;&lt; char(c - 32); }\n};\nint main() {\n    T a(&#x27;a&#x27;);\n    { T b(&#x27;b&#x27;); }\n    T c(&#x27;c&#x27;);\n}</code></pre>\n<ul><li><strong>A.</strong> abBcCA</li><li><strong>B.</strong> abcCBA</li><li><strong>C.</strong> abBcAC</li><li><strong>D.</strong> abcABC</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. abBcCA</strong>，实际输出 <code>abBcCA</code>。</p>\n<p>构造输出小写，析构输出大写。b 在花括号结束时析构；main 结束时，c 先于 a 析构（先构造的后析构）。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言 };\nstruct S : virtual F { S() : F(1) {} };\nstruct T : virtual F { T() : F(2) {} };\nstruct ST : S, T { ST() : F(9) {} };\nint main() { ST st; }</code></pre>\n<ul><li><strong>A.</strong> 9</li><li><strong>B.</strong> 12</li><li><strong>C.</strong> 129</li><li><strong>D.</strong> 912</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 9</strong>，实际输出 <code>9</code>。</p>\n<p>虚基类由最终派生类 ST 直接构造，且只构造一次；S、T 初始化列表里的 F(1)、F(2) 被忽略。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 17 虚基类</p>","plain":"## 题目\n\n```cpp\nstruct F { F(int x = 0) { cout << x; } };\nstruct S : virtual F { S() : F(1) {} };\nstruct T : virtual F { T() : F(2) {} };\nstruct ST : S, T { ST() : F(9) {} };\nint main() { ST st; }\n```\n\n- **A.** 9\n- **B.** 12\n- **C.** 129\n- **D.** 912\n\n## 口述答案\n\n答案是 **A. 9**，实际输出 `9`。\n\n虚基类由最终派生类 ST 直接构造，且只构造一次；S、T 初始化列表里的 F(1)、F(2) 被忽略。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 17 虚基类"},{"id":"Q-1637","title":"这段 C++ 代码输出什么？（18 虚函数 · 第 24 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>struct A {\n    void f() { cout &lt;&lt; &quot;A&quot;; }\n    virtual void g() { cout &lt;&lt; &quot;A&quot;; }\n};\nstruct B : A {\n    void f() { cout &lt;&lt; &quot;B&quot;; }\n    void g() { cout &lt;&lt; &quot;B&quot;; }\n};\nint main() {\n    B b;\n    A *p = &amp;b;\n    p-&gt;f(); p-&gt;g();\n}</code></pre>\n<ul><li><strong>A.</strong> AA</li><li><strong>B.</strong> AB</li><li><strong>C.</strong> BA</li><li><stro "## 题目\n\n```cpp\nmap  m;\nm[\"b\"] = 2;\nm[\"a\"] = 1;\nint z = m[\"c\"];\nfor (auto &p : m) cout << p.first;\n```\n\n- **A.** ba\n- **B.** ab\n- **C.** abc\n- **D.** bac\n\n## 口述答案\n\n答案是 **C. abc**，实际输出 `abc`。\n\nmap 按键排序；用 [] 读一个不存在的键会自动插入它（值为 0）。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 21 STL 容器"},{"id":"Q-1643","title":"这段 C++ 代码输出什么？（22 lambda · 第 30 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int x = 1;\nauto f = [x] { return x; };\nauto g = [&amp;x] { return x; };\nx = 5;\ncout &lt;&lt; f() &lt;&lt; g();</code></pre>\n<ul><li><strong>A.</strong> 15</li><li><strong>B.</strong> 55</li><li><strong>C.</strong> 11</li><li><strong>D.</strong> 51</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 15</strong>，实际输出 <code>15</code>。</p>\n<p>[x] 在创建 lambda 时拷贝一份 x（当时是 1）；[&amp;x] 引用外面的 x，调用时已经是 5。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 22 lambda</p>","plain":"## 题目\n\n```cpp\nint x = 1;\nauto f = [x] { return x; };\nauto g = [&x] { return x; };\nx = 5;\ncout << f() << g();\n```\n\n- **A.** 15\n- **B.** 55\n- **C.** 11\n- **D.** 51\n\n## 口述答案\n\n答案是 **A. 15**，实际输出 `15`。\n\n[x] 在创建 lambda 时拷贝一份 x（当时是 1）；[&x] 引用外面的 x，调用时已经是 5。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 22 lambda"},{"id":"Q-1644","title":"这段 C++ 代码输出什么？（23 流 · 第 31 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>cout &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; 3.14159 &lt;&lt; &quot; &quot;;\ncout &lt;&lt; setw(4) &lt;&lt; setfill(&#x27;*&#x27;) &lt;&lt; 7 &lt;&lt; 7;</code></pre>\n<ul><li><strong>A.</strong> 3.14 ***77</li><li><strong>B.</strong> 3.14 *<strong>7</strong>*7</li><li><strong>C.</strong> 3.1 ***77</li><li><strong>D.</strong> 3.14 7***7</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 3.14 </strong>*77<strong>，实际输出 <code>3.14 </strong>*77</code>。</p>\n<p>fixed 下 setprecision(2) 是两位小数；setw 只对紧跟的下一项有效，所以第二个 7 不再补齐。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 23 流</p>","plain":"## 题目\n\n```cpp\ncout << fixed << setprecision(2) << 3.14159 << \" \";\ncout << setw(4) << setfill('*') << 7 << 7;\n```\n\n- **A.** 3.14 ***77\n- **B.** 3.14 ***7***7\n- **C.** 3.1 ***77\n- **D.** 3.14 7***7\n\n## 口述答案\n\n答案是 **A. 3.14 ***77**，实际输出 `3.14 ***77`。\n\nfixed 下 setprecision(2) 是两位小数；setw 只对紧跟的下一项有效，所以第二个 7 不再补齐。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 23 流"},{"id":"Q-1645","title":"这段 C++ 代码输出什么？（24 异常 · 第 32 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>try {\n    cout &lt;&lt; &quot;A&quot;;\n    throw 1;\n    cout &lt;&lt; &quot;B&quot;;\n} catch (int) {\n    cout &lt;&lt; &quot;C&quot;;\n}\ncout &lt;&lt; &quot;D&quot;;</code></pre>\n<ul><li><strong>A.</strong> ACD</li><li><strong>B.</strong> ABCD</li><li><strong>C.</strong> AD</li><li><strong>D.</strong> ABD</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. ACD</strong>，实际输出 <code>ACD</code>。</p>\n<p>throw 之后的语句不再执行，直接跳到匹配的 catch；处理完继续往下走。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 24 异常</p>","plain":"## 题目\n\n```cpp\ntry {\n    cout << \"A\";\n    throw 1;\n    cout << \"B\";\n} catch (int) {\n    cout << \"C\";\n}\ncout << \"D\";\n```\n\n- **A.** ACD\n- **B.** ABCD\n- **C.** AD\n- **D.** ABD\n\n## 口述答案\n\n答案是 **A. ACD**，实际输出 `ACD`。\n\nthrow 之后的语句不再执行，直接跳到匹配的 catch；处理完继续往下走。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 24 异常"},{"id":"Q-1646","title":"这段 C++ 代码输出什么？（25 智能指针 · 第 33 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>auto a = make_shared&lt;int&gt;(1);\nauto b = a;\n{\n    auto c = b;\n    cout &lt;&lt; a.use_count();\n}\ncout &lt;&lt; a.use_count();</code></pre>\n<ul><li><strong>A.</strong> 32</li><li><strong>B.</strong> 33</li><li><strong>C.</strong> 22</li><li><strong>D.</strong> 31</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 32</strong>，实际输出 <code>32</code>。</p>\n<p>a、b、c 共享同一个对象，计数是 3；c 离开作用域后减为 2。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 25 智能指针</p>","plain":"## 题目\n\n```cpp\nauto a = make_shared (1);\nauto b = a;\n{\n    auto c = b;\n    cout << a.use_count();\n}\ncout << a.use_count();\n```\n\n- **A.** 32\n- **B.** 33\n- **C.** 22\n- **D.** 31\n\n## 口述答案\n\n答案是 **A. 32**，实际输出 `32`。\n\na、b、c 共享同一个对象，计数是 3；c 离开作用域后减为 2。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 25 智能指针"},{"id":"Q-1647","title":"这段 C++ 代码输出什么？（28 迭代器与 string · 第 34 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>string s = &quot;hello@sina.com&quot;;\ncout &lt;&lt; s.substr(0, s.find(&#x27;@&#x27;));</code></pre>\n<ul><li><strong>A.</strong> hello</li><li><strong>B.</strong> hello@</li><li><strong>C.</strong> hello@sina.com</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. hello</strong>，实际输出 <code>hello</code>。</p>\n<p>find 返回 '@' 的下标 5；substr(0, 5) 的第二个参数是长度、不是结束下标，所以取前 5 个字符。find 找不到时返回 string::npos，不能当下标用。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 28 迭代器与 string</p>","plain":"## 题目\n\n```cpp\nstring s = \"hello@sina.com\";\ncout << s.substr(0, s.find('@'));\n```\n\n- **A.** hello\n- **B.** hello@\n- **C.** hello@sina.com\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. hello**，实际输出 `hello`。\n\nfind 返回 '@' 的下标 5；substr(0, 5) 的第二个参数是长度、不是结束下标，所以取前 5 个字符。find 找不到时返回 string::npos，不能当下标用。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 28 迭代器与 string"},{"id":"Q-1648","title":"这段 C++ 代码输出什么？（28 迭代器与 string · 第 35 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>string s = &quot;abc&quot;;\ncout &lt;&lt; (s.find(&#x27;x&#x27;) == string::npos) &lt;&lt; &quot; &quot; &lt;&lt; s.rfind(&#x27;b&#x27;);</code></pre>\n<ul><li><strong>A.</strong> 1 1</li><li><strong>B.</strong> 0 1</li><li><strong>C.</strong> 1 0</li><li><strong>D.</strong> 0 -1</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1 1</strong>，实际输出 <code>1 1</code>。</p>\n<p>find('x') 找不到返回 string::npos，与它比较得 true，输出 1；rfind('b') 从后往前找，返回的下标仍是 1。npos 不是 -1 的有效下标。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 28 迭代器与 string</p>","plain":"## 题目\n\n```cpp\nstring s = \"abc\";\ncout << (s.find('x') == string::npos) << \" \" << s.rfind('b');\n```\n\n- **A.** 1 1\n- **B.** 0 1\n- **C.** 1 0\n- **D.** 0 -1\n\n## 口述答案\n\n答案是 **A. 1 1**，实际输出 `1 1`。\n\nfind('x') 找不到返回 string::npos，与它比较得 true，输出 1；rfind('b') 从后往前找，返回的下标仍是 1。npos 不是 -1 的有效下标。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 28 迭代器与 string"},{"id":"Q-1649","title":"这段 C++ 代码输出什么？（28 迭代器与 string · 第 36 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>vector&lt;int&gt; v{1,2,3};\ncout &lt;&lt; *v.begin() &lt;&lt; &quot; &quot; &lt;&lt; *(v.end()-1)\n     &lt;&lt; &quot; &quot; &lt;&lt; (v.end()-v.begin());</code></pre>\n<ul><li><strong>A.</strong> 1 3 3</li><li><strong>B.</strong> 1 3 4</li><li><strong>C.</strong> 1 2 3</li><li><strong>D.</strong> 0 3 3</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1 3 3</strong>，实际输出 <code>1 3 3</code>。</p>\n<p>begin 指向第一个元素，end 指向最后一个元素的下一个位置，构成左闭右开 [begin, end)；随机访问迭代器相减得到元素个数 3。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 28 迭代器与 string</p>","plain":"## 题目\n\n```cpp\nvector  v{1,2,3};\ncout << *v.begin() << \" \" << *(v.end()-1)\n     << \" \" << (v.end()-v.begin());\n```\n\n- **A.** 1 3 3\n- **B.** 1 3 4\n- **C.** 1 2 3\n- **D.** 0 3 3\n\n## 口述答案\n\n答案是 **A. 1 3 3**，实际输出 `1 3 3`。\n\nbegin 指向第一个元素，end 指向最后一个元素的下一个位置，构成左闭右开 [begin, end)；随机访问迭代器相减得到元素个数 3。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 28 迭代器与 string"},{"id":"Q-1650","title":"这段 C++ 代码输出什么？（29 序列容器 · 第 37 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>vector&lt;int&gt; v{1,2,3};\nv.reserve(100);\ncout &lt;&lt; v.size() &lt;&lt; &quot; &quot; &lt;&lt; v.capacity();</code></pre>\n<ul><li><strong>A.</strong> 3 100</li><li><strong>B.</strong> 100 100</li><li><strong>C.</strong> 3 3</li><li><strong>D.</strong> 100 3</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 3 100</strong>，实际输出 <code>3 100</code>。</p>\n<p>reserve 只预留容量、不改变 size；提前知道元素个数可以避免多次扩容与迭代器失效。resize 才会改变 size。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 29 序列容器</p>","plain":"## 题目\n\n```cpp\nvector  v{1,2,3};\nv.reserve(100);\ncout << v.size() << \" \" << v.capacity();\n```\n\n- **A.** 3 100\n- **B.** 100 100\n- **C.** 3 3\n- **D.** 100 3\n\n## 口述答案\n\n答案是 **A. 3 100**，实际输出 `3 100`。\n\nreserve 只预留容量、不改变 size；提前知道元素个数可以避免多次扩容与迭代器失效。resize 才会改变 size。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 29 序列容器"},{"id":"Q-1651","title":"这段 C++ 代码输出什么？（29 序列容器 · 第 38 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>vector&lt;int&gt; v(5);\nv.reserve(100);\nvector&lt;int&gt;(v).swap(v);\ncout &lt;&lt; v.size() &lt;&lt; &quot; &quot; &lt;&lt; v.capacity();</code></pre>\n<ul><li><strong>A.</strong> 5 5</li><li><strong>B.</strong> 5 100</li><li><strong>C.</strong> 100 5</li><li><strong>D.</strong> 0 0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 5 5</strong>，实际输出 <code>5 5</code>。</p>\n<p>用拷贝构造出的临时 vector（容量紧贴 size）与原容器交换，临时对象析构时带走那块大内存；size 仍是 5，容量收缩到 5。C++11 起也可写 v.shrink_to_fit()，但只是非强制建议。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 29 序列容器</p>","plain":"## 题目\n\n```cpp\nvector  v(5);\nv.reserve(100);\nvector (v).swap(v);\ncout << v.size() << \" \" << v.capacity();\n```\n\n- **A.** 5 5\n- **B.** 5 100\n- **C.** 100 5\n- **D.** 0 0\n\n## 口述答案\n\n答案是 **A. 5 5**，实际输出 `5 5`。\n\n用拷贝构造出的临时 vector（容量紧贴 size）与原容器交换，临时对象析构时带走那块大内存；size 仍是 5，容量收缩到 5。C++11 起也可写 v.shrink_to_fit()，但只是非强制建议。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 29 序列容器"},{"id":"Q-1652","title":"这段 C++ 代码输出什么？（29 序列容器 · 第 39 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>vector&lt;int&gt; v{1,2,3};\ntry { cout &lt;&lt; v.at(5); }\ncatch (const out_of_range&amp;) { cout &lt;&lt; &quot;E&quot;; }</code></pre>\n<ul><li><strong>A.</strong> E</li><li><strong>B.</strong> 0</li><li><strong>C.</strong> 3</li><li><strong>D.</strong> 运行崩溃</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. E</strong>，实际输出 <code>E</code>。</p>\n<p>at() 会检查越界并抛 std::out_of_range，异常被 catch 住所以输出 E；operator[] 不检查越界，是未定义行为（可能读到垃圾值，也可能崩溃）。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 29 序列容器</p>","plain":"## 题目\n\n```cpp\nvector  v{1,2,3};\ntry { cout << v.at(5); }\ncatch (const out_of_range&) { cout << \"E\"; }\n```\n\n- **A.** E\n- **B.** 0\n- **C.** 3\n- **D.** 运行崩溃\n\n## 口述答案\n\n答案是 **A. E**，实际输出 `E`。\n\nat() 会检查越界并抛 std::out_of_range，异常被 catch 住所以输出 E；operator[] 不检查越界，是未定义行为（可能读到垃圾值，也可能崩溃）。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 29 序列容器"},{"id":"Q-1653","title":"这段 C++ 代码输出什么？（29 序列容器 · 第 40 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>deque&lt;int&gt; d{2,3};\nd.push_front(1); d.push_back(4);\nfor (int x : d) cout &lt;&lt; x;</code></pre>\n<ul><li><strong>A.</strong> 1234</li><li><strong>B.</strong> 2134</li><li><strong>C.</strong> 2341</li><li><strong>D.</strong> 1324</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1234</strong>，实际输出 <code>1234</code>。</p>\n<p>deque 两头插入都是 O(1)：push_front(1) 放到最前，push_back(4) 追加到最后，遍历得 1234。vector 没有 push_front。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 29 序列容器</p>","plain":"## 题目\n\n```cpp\ndeque  d{2,3};\nd.push_front(1); d.push_back(4);\nfor (int x : d) cout << x;\n```\n\n- **A.** 1234\n- **B.** 2134\n- **C.** 2341\n- **D.** 1324\n\n## 口述答案\n\n答案是 **A. 1234**，实际输出 `1234`。\n\ndeque 两头插入都是 O(1)：push_front(1) 放到最前，push_back(4) 追加到最后，遍历得 1234。vector 没有 push_front。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 29 序列容器"},{"id":"Q-1654","title":"这段 C++ 代码输出什么？（30 关联容器与适配器 · 第 41 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>set&lt;int&gt; s{3,1,2,1};\nfor (int x : s) cout &lt;&lt; x;</code></pre>\n<ul><li><strong>A.</strong> 123</li><li><strong>B.</strong> 3121</li><li><strong>C.</strong> 312</li><li><strong>D.</strong> 1213</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 123</strong>，实际输出 <code>123</code>。</p>\n<p>set 底层是红黑树：自动按键排序并去重，重复插入的 1 被忽略，遍历得升序 123。要保留重复键用 multiset。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 30 关联容器与适配器</p>","plain":"## 题目\n\n```cpp\nset  s{3,1,2,1};\nfor (int x : s) cout << x;\n```\n\n- **A.** 123\n- **B.** 3121\n- **C.** 312\n- **D.** 1213\n\n## 口述答案\n\n答案是 **A. 123**，实际输出 `123`。\n\nset 底层是红黑树：自动按键排序并去重，重复插入的 1 被忽略，遍历得升序 123。要保留重复键用 multiset。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 30 关联容器与适配器"},{"id":"Q-1655","title":"这段 C++ 代码输出什么？（30 关联容器与适配器 · 第 42 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>map&lt;string,int&gt; m;\ncout &lt;&lt; m[&quot;x&quot;] &lt;&lt; &quot; &quot; &lt;&lt; m.size();</code></pre>\n<ul><li><strong>A.</strong> 0 1</li><li><strong>B.</strong> 0 0</li><li><strong>C.</strong> 随机值 1</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 0 1</strong>，实际输出 <code>0 1</code>。</p>\n<p>用 [] 访问不存在的键会自动插入一个值初始化的默认值（int 得 0），size 从 0 变 1。只读判断键是否存在应改用 find() 或 at()。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 30 关联容器与适配器</p>","plain":"## 题目\n\n```cpp\nmap  m;\ncout << m[\"x\"] << \" \" << m.size();\n```\n\n- **A.** 0 1\n- **B.** 0 0\n- **C.** 随机值 1\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. 0 1**，实际输出 `0 1`。\n\n用 [] 访问不存在的键会自动插入一个值初始化的默认值（int 得 0），size 从 0 变 1。只读判断键是否存在应改用 find() 或 at()。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 30 关联容器与适配器"},{"id":"Q-1656","title":"这段 C++ 代码输出什么？（30 关联容器与适配器 · 第 43 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>stack&lt;int&gt; st;\nst.push(1); st.push(2);\ncout &lt;&lt; st.top(); st.pop(); cout &lt;&lt; st.top();</code></pre>\n<ul><li><strong>A.</strong> 21</li><li><strong>B.</strong> 12</li><li><strong>C.</strong> 22</li><li><strong>D.</strong> 11</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 21</strong>，实际输出 <code>21</code>。</p>\n<p>stack 是容器适配器，后进先出：压入 1、2 后 top 是 2；pop 只移除不返回，之后 top 回到 1。queue 则相反（先进先出）。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 30 关联容器与适配器</p>","plain":"## 题目\n\n```cpp\nstack  st;\nst.push(1); st.push(2);\ncout << st.top(); st.pop(); cout << st.top();\n```\n\n- **A.** 21\n- **B.** 12\n- **C.** 22\n- **D.** 11\n\n## 口述答案\n\n答案是 **A. 21**，实际输出 `21`。\n\nstack 是容器适配器，后进先出：压入 1、2 后 top 是 2；pop 只移除不返回，之后 top 回到 1。queue 则相反（先进先出）。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 30 关联容器与适配器"},{"id":"Q-1657","title":"这段 C++ 代码输出什么？（31 STL 算法 · 第 44 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"a p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 31 STL 算法</p>","plain":"## 题目\n\n```cpp\nvector  v{1,2,3,4};\ncout << count_if(v.begin(), v.end(),\n  [](int x){ return x % 2 == 0; });\n```\n\n- **A.** 2\n- **B.** 3\n- **C.** 1\n- **D.** 4\n\n## 口述答案\n\n答案是 **A. 2**，实际输出 `2`。\n\ncount_if 统计使谓词为 true 的元素：1 2 3 4 里偶数只有 2 和 4，共 2 个。谓词可以是 lambda、函数对象或普通函数。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 31 STL 算法"},{"id":"Q-1659","title":"这段 C++ 代码输出什么？（31 STL 算法 · 第 46 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>vector&lt;int&gt; v{1,2,3};\ntransform(v.begin(), v.end(), v.begin(),\n  [](int x){ return x * 2; });\nfor (int x : v) cout &lt;&lt; x;</code></pre>\n<ul><li><strong>A.</strong> 246</li><li><strong>B.</strong> 123</li><li><strong>C.</strong> 235</li><li><strong>D.</strong> 2 4 6</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 246</strong>，实际输出 <code>246</code>。</p>\n<p>transform 对每个元素应用一元操作并写到目标区间，这里就地翻倍成 2 4 6；输出时没有空格，所以连成 246。输入输出区间可以相同。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 31 STL 算法</p>","plain":"## 题目\n\n```cpp\nvector  v{1,2,3};\ntransform(v.begin(), v.end(), v.begin(),\n  [](int x){ return x * 2; });\nfor (int x : v) cout << x;\n```\n\n- **A.** 246\n- **B.** 123\n- **C.** 235\n- **D.** 2 4 6\n\n## 口述答案\n\n答案是 **A. 246**，实际输出 `246`。\n\ntransform 对每个元素应用一元操作并写到目标区间，这里就地翻倍成 2 4 6；输出时没有空格，所以连成 246。输入输出区间可以相同。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 31 STL 算法"},{"id":"Q-1660","title":"这段 C++ 代码输出什么？（31 STL 算法 · 第 47 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>vector&lt;int&gt; v{1,3,3,3,5};\ncout &lt;&lt; lower_bound(v.begin(),v.end(),3)-v.begin()\n     &lt;&lt; &quot; &quot; &lt;&lt; upper_bound(v.begin(),v.end(),3)-v.begin();</code></pre>\n<ul><li><strong>A.</strong> 1 4</li><li><strong>B.</strong> 1 3</li><li><strong>C.</strong> 2 4</li><li><strong>D.</strong> 3 4</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1 4</strong>，实际输出 <code>1 4</code>。</p>\n<p>lower_bound 返回第一个「不小于 3」的位置 1，upper_bound 返回第一个「大于 3」的位置 4；相减就是相等元素个数 3。前提是区间已排序，复杂度 O(log n)。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 31 STL 算法</p>","plain":"## 题目\n\n```cpp\nvector  v{1,3,3,3,5};\ncout << lower_bound(v.begin(),v.end(),3)-v.begin()\n     << \" \" << upper_bound(v.begin(),v.end(),3)-v.begin();\n```\n\n- **A.** 1 4\n- **B.** 1 3\n- **C.** 2 4\n- **D.** 3 4\n\n## 口述答案\n\n答案是 **A. 1 4**，实际输出 `1 4`。\n\nlower_bound 返回第一个「不小于 3」的位置 1，upper_bound 返回第一个「大于 3」的位置 4；相减就是相等元素个数 3。前提是区间已排序，复杂度 O(log n)。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 31 STL 算法"},{"id":"Q-1661","title":"这段 C++ 代码输出什么？（31 STL 算法 · 第 48 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int a[4] = {3,1,4,2};\nsort(a, a+4);\ncout &lt;&lt; binary_search(a,a+4,3) &lt;&lt; &quot; &quot;\n     &lt;&lt; binary_search(a,a+4,5);</code></pre>\n<ul><li><strong>A.</strong> 1 0</li><li><strong>B.</strong> 0 1</li><li><strong>C.</strong> 1 1</li><li><strong>D.</strong> 0 0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1 0</strong>，实际输出 <code>1 0</code>。</p>\n<p>binary_search 只回答「是否存在」，返回 bool（输出 1 / 0），不返回位置；必须先排序，否则结果无意义。要位置用 lower_bound。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 31 STL 算法</p>","plain":"## 题目\n\n```cpp\nint a[4] = {3,1,4,2};\nsort(a, a+4);\ncout << binary_search(a,a+4,3) << \" \"\n     << binary_search(a,a+4,5);\n```\n\n- **A.** 1 0\n- **B.** 0 1\n- **C.** 1 1\n- **D.** 0 0\n\n## 口述答案\n\n答案是 **A. 1 0**，实际输出 `1 0`。\n\nbinary_search 只回答「是否存在」，返回 bool（输出 1 / 0），不返回位置；必须先排序，否则结果无意义。要位置用 lower_bound。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 31 STL 算法"},{"id":"Q-1662","title":"这段 C++ 代码输出什么？（32 函数对象与谓词 · 第 49 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>struct Odd {\n  bool operator()(int x) const { return x % 2 != 0; }\n};\nvector&lt;int&gt; v{1,2,3,4,5};\ncout &lt;&lt; count_if(v.begin(), v.end(), Odd());</code></pre>\n<ul><li><strong>A.</strong> 3</li><li><strong>B.</strong> 2</li><li><strong>C.</strong> 5</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 3</strong>，实际输出 <code>3</code>。</p>\n<p>函数对象（仿函数）是重载了 operator() 的类实例，count_if 对每个元素调用它；1 3 5 为奇数共 3 个。相比普通函数，它可以带状态。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 32 函数对象与谓词</p>","plain":"## 题目\n\n```cpp\nstruct Odd {\n  bool operator()(int x) const { return x % 2 != 0; }\n};\nvector  v{1,2,3,4,5};\ncout << count_if(v.begin(), v.end(), Odd());\n```\n\n- **A.** 3\n- **B.** 2\n- **C.** 5\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. 3**，实际输出 `3`。\n\n函数对象（仿函数）是重载了 operator() 的类实例，count_if 对每个元素调用它；1 3 5 为奇数共 3 个。相比普通函数，它可以带状态。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 32 函数对象与谓词"},{"id":"Q-1663","title":"这段 C++ 代码输出什么？（32 函数对象与谓词 · 第 50 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>greater&lt;int&gt; g;\ncout &lt;&lt; g(3,5) &lt;&lt; &quot; &quot; &lt;&lt; g(5,3);</code></pre>\n<ul><li><strong>A.</strong> 0 1</li><li><strong>B.</strong> 1 0</li><li><strong>C.</strong> 1 1</li><li><strong>D.</strong> 0 0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 0 1</strong>，实际输出 <code>0 1</code>。</p>\n<p>greater&lt;int&gt;()(a,b) 等价于 a &gt; b：3&gt;5 为假输出 0，5&gt;3 为真输出 1。把它作为第三参数传给 sort 就是降序。谓词比较函数必须满足严格弱序，不能写 &gt;=。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 32 函数对象与谓词</p>","plain":"## 题目\n\n```cpp\ngreater  g;\ncout  ()(a,b) 等价于 a > b：3>5 为假输出 0，5>3 为真输出 1。把它作为第三参数传给 sort 就是降序。谓词比较函数必须满足严格弱序，不能写 >=。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 32 函数对象与谓词"},{"id":"Q-1664","title":"这段 C++ 代码输出什么？（33 lambda 与绑定 · 第 51 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int x = 1;\nauto f = [x]{ return x; };\nauto g = [&amp;x]{ return x; };\nx = 9;\ncout &lt;&lt; f() &lt;&lt; &quot; &quot; &lt;&lt; g();</code></pre>\n<ul><li><strong>A.</strong> 1 9</li><li><strong>B.</strong> 9 9</li><li><strong>C.</strong> 1 1</li><li><strong>D.</strong> 9 1</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1 9</strong>，实际输出 <code>1 9</code>。</p>\n<p>[x] 按值捕获，在创建时拷贝一份，之后 x 改成 9 也不影响 f；[&amp;x] 按引用捕获，g 看到的是修改后的 9。按引用捕获要保证 lambda 执行时变量还活着。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 33 lambda 与绑定</p>","plain":"## 题目\n\n```cpp\nint x = 1;\nauto f = [x]{ return x; };\nauto g = [&x]{ return x; };\nx = 9;\ncout << f() << \" \" << g();\n```\n\n- **A.** 1 9\n- **B.** 9 9\n- **C.** 1 1\n- **D.** 9 1\n\n## 口述答案\n\n答案是 **A. 1 9**，实际输出 `1 9`。\n\n[x] 按值捕获，在创建时拷贝一份，之后 x 改成 9 也不影响 f；[&x] 按引用捕获，g 看到的是修改后的 9。按引用捕获要保证 lambda 执行时变量还活着。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 33 lambda 与绑定"},{"id":"Q-1665","title":"这段 C++ 代码输出什么？（33 lambda 与绑定 · 第 52 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>auto f = [](int a, int b){ return a &gt; b ? a : b; };\ncout &lt;&lt; f(3, 7);</code></pre>\n<ul><li><strong>A.</strong> 7</li><li><strong>B.</strong> 3</li><li><strong>C.</strong> 10</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 7</strong>，实际输出 <code>7</code>。</p>\n<p>lambda 的三段是 [] 捕获列表、() 参数、{} 函数体；这里返回两数较大者 7。[] 空捕获表示不使用外部局部变量。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 33 lambda 与绑定</p>","plain":"## 题目\n\n```cpp\nauto f = [](int a, int b){ return a > b ? a : b; };\ncout << f(3, 7);\n```\n\n- **A.** 7\n- **B.** 3\n- **C.** 10\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. 7**，实际输出 `7`。\n\nlambda 的三段是 [] 捕获列表、() 参数、{} 函数体；这里返回两数较大者 7。[] 空捕获表示不使用外部局部变量。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 33 lambda 与绑定"},{"id":"Q-1666","title":"这段 C++ 代码输出什么？（34 类型转换与模板 · 第 53 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>double d = 3.9;\ncout &lt;&lt; static_cast&lt;int&gt;(d) &lt;&lt; &quot; &quot; &lt;&lt; (int)d;</code></pre>\n<ul><li><strong>A.</strong> 3 3</li><li><strong>B.</strong> 3 4</li><li><strong>C.</strong> 4 4</li><li><strong>D.</strong> 3.9 3</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 3 3</strong>，实际输出 <code>3 3</code>。</p>\n<p>浮点转整型是截断、不是四舍五入，两者都得 3。static_cast 与 C 风格括号结果相同，但语义明确、便于搜索；向下转型做运行时检查要用 dynamic_cast。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 34 类型转换与模板</p>","plain":"## 题目\n\n```cpp\ndouble d = 3.9;\ncout  (d) << \" \" << (int)d;\n```\n\n- **A.** 3 3\n- **B.** 3 4\n- **C.** 4 4\n- **D.** 3.9 3\n\n## 口述答案\n\n答案是 **A. 3 3**，实际输出 `3 3`。\n\n浮点转整型是截断、不是四舍五入，两者都得 3。static_cast 与 C 风格括号结果相同，但语义明确、便于搜索；向下转型做运行时检查要用 dynamic_cast。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 34 类型转换与模板"},{"id":"Q-1667","title":"这段 C++ 代码输出什么？（34 类型转换与模板 · 第 54 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>template&lt;class T&gt; T add(T a, T b){ return a + b; }\nint main() {\n  cout &lt;&lt; add&lt;int&gt;(2,3) &lt;&lt; &quot; &quot; &lt;&lt; add&lt;double&gt;(1.5,2.5);\n}</code></pre>\n<ul><li><strong>A.</strong> 5 4</li><li><strong>B.</strong> 5 4.0</li><li><strong>C.</strong> 5 4.5</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 5 4</strong>，实际输出 <code>5 4</code>。</p>\n<p>显式指定 T 后分别实例化 int 与 double 版本，结果是 5 和 4.0；cout 默认不显示末尾的 .0，所以输出 5 4。推导必须一致，add(2, 2.5) 会编译失败。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 34 类型转换与模板</p>","plain":"## 题目\n\n```cpp\ntemplate  T add(T a, T b){ return a + b; }\nint main() {\n  cout  (2,3)  (1.5,2.5);\n}\n```\n\n- **A.** 5 4\n- **B.** 5 4.0\n- **C.** 5 4.5\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. 5 4**，实际输出 `5 4`。\n\n显式指定 T 后分别实例化 int 与 double 版本，结果是 5 和 4.0；cout 默认不显示末尾的 .0，所以输出 5 4。推导必须一致，add(2, 2.5) 会编译失败。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 34 类型转换与模板"},{"id":"Q-1668","title":"这段 C++ 代码输出什么？（35 chrono 与时间 · 第 55 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>auto d = chrono::milliseconds(1500);\ncout &lt;&lt; chrono::duration_cast&lt;chrono::seconds&gt;(d).count()\n     &lt;&lt; &quot; &quot; &lt;&lt; d.count();</code></pre>\n<ul><li><strong>A.</strong> 1 1500</li><li><strong>B.</strong> 1.5 1500</li><li><strong>C.</strong> 2 1500</li><li><strong>D.</strong> 1500 1</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 1 1500</strong>，实际输出 <code>1 1500</code>。</p>\n<p>duration_cast 从细粒度向粗粒度转换时向零截断，1500ms 变 1 秒；原 duration 的 count() 仍以毫秒为单位，是 1500。类型里带着单位，不会把秒和毫秒混用。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 35 chrono 与时间</p>","plain":"## 题目\n\n```cpp\nauto d = chrono::milliseconds(1500);\ncout  (d).count()\n     << \" \" << d.count();\n```\n\n- **A.** 1 1500\n- **B.** 1.5 1500\n- **C.** 2 1500\n- **D.** 1500 1\n\n## 口述答案\n\n答案是 **A. 1 1500**，实际输出 `1 1500`。\n\nduration_cast 从细粒度向粗粒度转换时向零截断，1500ms 变 1 秒；原 duration 的 count() 仍以毫秒为单位，是 1500。类型里带着单位，不会把秒和毫秒混用。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 35 chrono 与时间"},{"id":"Q-1669","title":"这段 C++ 代码输出什么？（35 chrono 与时间 · 第 56 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>cout &lt;&lt; chrono::duration_cast&lt;chrono::milliseconds&gt;(\n       chrono::seconds(2)).count();</code></pre>\n<ul><li><strong>A.</strong> 2000</li><li><strong>B.</strong> 2</li><li><strong>C.</strong> 200</li><li><strong>D.</strong> 20</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 2000</strong>，实际输出 <code>2000</code>。</p>\n<p>秒转毫秒是放大，不丢精度，2s = 2000ms；反方向（毫秒转秒）才可能截断。ROS2 里 rclcpp::Duration 与 std::chrono 互转时也要先统一单位。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 35 chrono 与时间</p>","plain":"## 题目\n\n```cpp\ncout  (\n       chrono::seconds(2)).count();\n```\n\n- **A.** 2000\n- **B.** 2\n- **C.** 200\n- **D.** 20\n\n## 口述答案\n\n答案是 **A. 2000**，实际输出 `2000`。\n\n秒转毫秒是放大，不丢精度，2s = 2000ms；反方向（毫秒转秒）才可能截断。ROS2 里 rclcpp::Duration 与 std::chrono 互转时也要先统一单位。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 35 chrono 与时间"},{"id":"Q-1670","title":"这段 C++ 代码输出什么？（36 智能指针与移动语义 · 第 57 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>auto a = make_shared&lt;int&gt;(7);\n{ auto b = a; cout &lt;&lt; a.use_count() &lt;&lt; &quot; &quot;; }\ncout &lt;&lt; a.use_count();</code></pre>\n<ul><li><strong>A.</strong> 2 1</li><li><strong>B.</strong> 1 1</li><li><strong>C.</strong> 2 2</li><li><strong>D.</strong> 1 0</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 2 1</strong>，实际输出 <code>2 1</code>。</p>\n<p>拷贝 shared_ptr 使引用计数从 1 增到 2；离开内层作用域析构 b 后减回 1。计数归零才真正 delete 对象；互持有 shared_ptr 会造成循环引用，需要 weak_ptr 打破。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 36 智能指针与移动语义</p>","plain":"## 题目\n\n```cpp\nauto a = make_shared (7);\n{ auto b = a; cout << a.use_count() << \" \"; }\ncout << a.use_count();\n```\n\n- **A.** 2 1\n- **B.** 1 1\n- **C.** 2 2\n- **D.** 1 0\n\n## 口述答案\n\n答案是 **A. 2 1**，实际输出 `2 1`。\n\n拷贝 shared_ptr 使引用计数从 1 增到 2；离开内层作用域析构 b 后减回 1。计数归零才真正 delete 对象；互持有 shared_ptr 会造成循环引用，需要 weak_ptr 打破。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 36 智能指针与移动语义"},{"id":"Q-1671","title":"这段 C++ 代码输出什么？（36 智能指针与移动语义 · 第 58 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>string s = &quot;hello&quot;;\nstring t = std::move(s);\ncout &lt;&lt; t.size() &lt;&lt; &quot; &quot; &lt;&lt; s.size();</code></pre>\n<ul><li><strong>A.</strong> 5 0</li><li><strong>B.</strong> 5 5</li><li><strong>C.</strong> 0 5</li><li><strong>D.</strong> 编译错误</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 5 0</strong>，实际输出 <code>5 0</code>。</p>\n<p>std::move 只做类型转换、不移动任何东西；移动构造把资源转给 t。被 move 后的 s 处于「有效但未指定」状态，本机 libstdc++ 实测 size() 为 0，其他实现可能不同——不要再读它的值，但可以重新赋值或析构。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 36 智能指针与移动语义</p>","plain":"## 题目\n\n```cpp\nstring s = \"hello\";\nstring t = std::move(s);\ncout << t.size() << \" \" << s.size();\n```\n\n- **A.** 5 0\n- **B.** 5 5\n- **C.** 0 5\n- **D.** 编译错误\n\n## 口述答案\n\n答案是 **A. 5 0**，实际输出 `5 0`。\n\nstd::move 只做类型转换、不移动任何东西；移动构造把资源转给 t。被 move 后的 s 处于「有效但未指定」状态，本机 libstdc++ 实测 size() 为 0，其他实现可能不同——不要再读它的值，但可以重新赋值或析构。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 36 智能指针与移动语义"},{"id":"Q-1672","title":"这段 C++ 代码输出什么？（37 流与字符串处理 · 第 59 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>istringstream iss(&quot;1 2 3&quot;);\nint x, sum = 0;\nwhile (iss &gt;&gt; x) sum += x;\ncout &lt;&lt; sum;</code></pre>\n<ul><li><strong>A.</strong> 6</li><li><strong>B.</strong> 123</li><li><strong>C.</strong> 3</li><li><strong>D.</strong> 1 2 3</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 6</strong>，实际输出 <code>6</code>。</p>\n<p>用 while(iss &gt;&gt; x) 逐个读整数并累加；读取失败或到达末尾时表达式为假，循环自然结束。不要写 while(!iss.eof())，它会让最后一项多处理一次。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 37 流与字符串处理</p>","plain":"## 题目\n\n```cpp\nistringstream iss(\"1 2 3\");\nint x, sum = 0;\nwhile (iss >> x) sum += x;\ncout  > x) 逐个读整数并累加；读取失败或到达末尾时表达式为假，循环自然结束。不要写 while(!iss.eof())，它会让最后一项多处理一次。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 37 流与字符串处理"},{"id":"Q-1673","title":"这段 C++ 代码输出什么？（37 流与字符串处理 · 第 60 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>cout &lt;&lt; setw(6) &lt;&lt; setfill(&#x27;0&#x27;) &lt;&lt; 42\n     &lt;&lt; &quot; &quot; &lt;&lt; fixed &lt;&lt; setprecision(2) &lt;&lt; 3.14159;</code></pre>\n<ul><li><strong>A.</strong> 000042 3.14</li><li><strong>B.</strong> 42 3.14</li><li><strong>C.</strong> 000042 3.14159</li><li><strong>D.</strong> 00042 3.14</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 000042 3.14</strong>，实际输出 <code>000042 3.14</code>。</p>\n<p>setw(6) + setfill('0') 补成 6 位得 000042；fixed 配合 setprecision(2) 是小数点后 2 位，得 3.14（不加 fixed 则是 2 位有效数字 3.1）。setw 只对下一项有效，setfill / fixed / precision 持续有效。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 37 流与字符串处理</p>","plain":"## 题目\n\n```cpp\ncout << setw(6) << setfill('0') << 42\n     << \" \" << fixed << setprecision(2) << 3.14159;\n```\n\n- **A.** 000042 3.14\n- **B.** 42 3.14\n- **C.** 000042 3.14159\n- **D.** 00042 3.14\n\n## 口述答案\n\n答案是 **A. 000042 3.14**，实际输出 `000042 3.14`。\n\nsetw(6) + setfill('0') 补成 6 位得 000042；fixed 配合 setprecision(2) 是小数点后 2 位，得 3.14（不加 fixed 则是 2 位有效数字 3.1）。setw 只对下一项有效，setfill / fixed / precision 持续有效。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 37 流与字符串处理"},{"id":"Q-1674","title":"这段 C++ 代码输出什么？（38 多线程与状态机 · 第 61 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>atomic&lt;int&gt; s{0};\nthread t1([&amp;]{ s += 1; });\nthread t2([&amp;]{ s += 1; });\nt1.join(); t2.join();\ncout &lt;&lt; s.load();</code></pre>\n<ul><li><strong>A.</strong> 2</li><li><strong>B.</strong> 0</li><li><strong>C.</strong> 1</li><li><strong>D.</strong> 结果不确定</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. 2</strong>，实际输出 <code>2</code>。</p>\n<p>atomic 的 += 是原子操作，两个线程各加 1 后必为 2；若换成普通 int 并发自增，就是数据竞争，属于未定义行为。join 等待线程结束，detach 则要自己保证被捕获的变量还活着。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 38 多线程与状态机</p>","plain":"## 题目\n\n```cpp\natomic  s{0};\nthread t1([&]{ s += 1; });\nthread t2([&]{ s += 1; });\nt1.join(); t2.join();\ncout << s.load();\n```\n\n- **A.** 2\n- **B.** 0\n- **C.** 1\n- **D.** 结果不确定\n\n## 口述答案\n\n答案是 **A. 2**，实际输出 `2`。\n\natomic 的 += 是原子操作，两个线程各加 1 后必为 2；若换成普通 int 并发自增，就是数据竞争，属于未定义行为。join 等待线程结束，detach 则要自己保证被捕获的变量还活着。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 38 多线程与状态机"},{"id":"Q-1675","title":"这段 C++ 代码输出什么？（38 多线程与状态机 · 第 62 题）","module":"04_algo","moduleName":"算法机考","sub":"C++语言细节","priority":"P0","difficulty":2,"status":"answered","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","读程序写结果","机考","语言细节"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<pre><code>int st = 0; string in = &quot;abab&quot;, out;\nfor (char c : in) {\n  if (st == 0) { out += toupper(c); st = 1; }\n  else { out += c; st = 0; }\n}\ncout &lt;&lt; out;</code></pre>\n<ul><li><strong>A.</strong> AbAb</li><li><strong>B.</strong> ABAB</li><li><strong>C.</strong> aBaB</li><li><strong>D.</strong> abab</li></ul>\n<h2>口述答案</h2>\n<p>答案是 <strong>A. AbAb</strong>，实际输出 <code>AbAb</code>。</p>\n<p>两个状态交替：状态 0 把字符转大写并切到 1，状态 1 原样输出并切回 0，所以 a→A、b→b、a→A、b→b。状态机题的关键是把「当前状态 + 输入 → 次状态」列清楚再推。</p>\n<h2>讲深一层</h2>\n<p>待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>无（语言基础题）。</p>\n<h2>来源</h2>\n<p><code>教学文档/C++实验台/C++考点实验台.html</code> · 38 多线程与状态机</p>","plain":"## 题目\n\n```cpp\nint st = 0; string in = \"abab\", out;\nfor (char c : in) {\n  if (st == 0) { out += toupper(c); st = 1; }\n  else { out += c; st = 0; }\n}\ncout << out;\n```\n\n- **A.** AbAb\n- **B.** ABAB\n- **C.** aBaB\n- **D.** abab\n\n## 口述答案\n\n答案是 **A. AbAb**，实际输出 `AbAb`。\n\n两个状态交替：状态 0 把字符转大写并切到 1，状态 1 原样输出并切回 0，所以 a→A、b→b、a→A、b→b。状态机题的关键是把「当前状态 + 输入 → 次状态」列清楚再推。\n\n## 讲深一层\n\n待补充：把这条规则扩到相邻场景（换个运算符、换个类型、换个边界值会不会变）。\n机考里这类题错一次就是整题分，靠的是把规则记准而不是临场推。\n\n## 高频追问\n\n待补充。\n\n## 易错点\n\n待补充。\n\n## 关联项目\n\n无（语言基础题）。\n\n## 来源\n\n`教学文档/C++实验台/C++考点实验台.html` · 38 多线程与状态机"},{"id":"Q-1676","title":"读入两个数求和 的 ACM 输入输出怎么写？","module":"04_algo","moduleName":"算法机考","sub":"C++ ACM输入输出","priority":"P0","difficulty":1,"status":"draft","qtype":"coding","roles":["AI算法","端侧部署"],"companies":["华为车BU","亿嘉和"],"tags":["C++","ACM","输入输出","机考"],"sourceRef":"教学文档/C++实验台/C++考点实验台.html","html":"<h2>题目</h2>\n<p>机考要在 ACM 模式下自己读输入、自己输出，没有函数签名提示。下面这段 C++ 程序对应的读入与输出写法是什么？</p>\n<pre><code>int a, b;\ncin &gt;&gt; a &gt;&gt; b;\ncout &lt;&lt; &quot;a+b=&quot; &lt;&lt; a + b &lt;&lt; &#x27;\\n&#x27;;</code></pre>\n<p>输入样例：</p>\n<pre><code>3 4</code></pre>\n<p>输出样例：</p>\n<pre><code>a+b=7
