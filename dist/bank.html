<script>
const DATA = [{"id":"Q-0101","title":"介绍一下你的本科毕设","module":"01_project","moduleName":"项目深挖","sub":"4G道路测温","priority":"P0","difficulty":2,"status":"answered","qtype":"project","roles":["嵌入式","感知"],"companies":["亿嘉和","华为车BU"],"tags":["毕设","DHT11","STM32","4G","传感器","链路"],"sourceRef":"方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf","html":"<h2>口述答案</h2>\n<blockquote>我的毕设是「基于 4G 通信的道路温度获取方法」，一句话说就是把路面温度采上来、用 4G 发到云端、能在网页上看曲线。整条链路分四层：测量是 DHT11 贴地测温，主控是 STM32F103，通信是 4G Cat.1 的 DTU 走 RS485，最后到云端做展示和曲线分析。我做的工作量不在「采一个温度」，而在把这条链路打通并且可控——DHT11 是单总线，时序要求严，我用寄存器配 GPIO 做输入输出切换，采样时关中断防误码； DTU 那层我封了一个 AT 指令收发函数，发出去之后必须在超时窗口里匹配到期望应答才算成功。落地结论是：链路可行性验证通过，但 DHT11 量程只到 50℃，夏季沥青路面能到 60℃ 以上，这是这个方案明确的短板。</blockquote>\n<h2>讲深一层</h2>\n<p>四层职责划分（面试官问\"哪些是你写的\"就按这层讲）：</p>\n<table><thead><tr><th>层</th><th>承担什么</th><th>关键点</th></tr></thead><tbody><tr><td>驱动层</td><td>DHT11 单总线时序、UART / RS485 收发</td><td>微秒级延时、GPIO 方向切换、关中断</td></tr><tr><td>模块层</td><td>DTU 初始化与 AT 指令交互</td><td>应答匹配 + 超时判据</td></tr><tr><td>业务层</td><td>采集 → 解析 → 组帧 → 发送</td><td>帧格式、校验</td></tr><tr><td>应用层</td><td>云端接收、数据展示与曲线</td><td>时间戳依赖 RTC</td></tr></tbody></table>\n<p>链路串起来是：DHT11 → GPIO → STM32 解析 → 组帧 → RS485 → DTU → 4G → 云。</p>\n<h2>高频追问</h2>\n<ol><li><strong>为什么用 RS485 不用 TTL 串口？</strong> —— 差分传输抗共模干扰，传输距离可达千米级，设备装在车上或野外走长线更稳。</li><li><strong>Cat.1 和 NB-IoT 怎么选？</strong> —— Cat.1 上下行约 5 / 10 Mbps，适合小数据量但要有一定实时性；NB-IoT 只有百 kbps 级，超低功耗广覆盖，适合抄表这类不需要实时的场景。</li><li><strong>系统怎么确认真的连上云了？</strong> —— DTU 注册到云后服务器会回固定一帧注册包 <code>0xAF 0x20 0x7E 0x00 0x01 0x5A</code>，用它作为判据，而不是「发出去了应该成了」。</li><li><strong>你的 RTC 为什么单接纽扣电池？</strong> —— 主电源掉电时维持 RTC 走时和后备寄存器，重启后时间戳不用重设，采集系统没有时间戳等于数据废掉。</li></ol>\n<h2>易错点</h2>\n<ul><li>❌ 说「DHT11 是红外测温传感器」 —— 论文里自己笔误过一处，面试说错是硬伤</li><li>✅ 说「复合式数字温湿度传感器：电阻式湿敏元件 + NTC 测温元件，内部集成 8 位单片机做校准和数字输出」</li><li>❌ 只讲「采集-上传-显示」不讲难点 —— 听起来像课程实验</li><li>✅ 一定要带出「时序严 + 超时判据 + 量程短板」这三件真事</li></ul>\n<h2>关联项目</h2>\n<ul><li><code>方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf</code></li><li><code>方向与规划/项目/毕设/4G道路温度采集_项目包</code></li></ul>\n<h2>来源</h2>\n<p>本人本科毕设（2026）</p>","plain":"## 口述答案\n\n> 我的毕设是「基于 4G 通信的道路温度获取方法」，一句话说就是把路面温度采上来、\n> 用 4G 发到云端、能在网页上看曲线。整条链路分四层：测量是 DHT11 贴地测温，\n> 主控是 STM32F103，通信是 4G Cat.1 的 DTU 走 RS485，最后到云端做展示和曲线分析。\n> 我做的工作量不在「采一个温度」，而在把这条链路打通并且可控——DHT11 是单总线，\n> 时序要求严，我用寄存器配 GPIO 做输入输出切换，采样时关中断防误码；\n> DTU 那层我封了一个 AT 指令收发函数，发出去之后必须在超时窗口里匹配到期望应答才算成功。\n> 落地结论是：链路可行性验证通过，但 DHT11 量程只到 50℃，夏季沥青路面能到 60℃ 以上，\n> 这是这个方案明确的短板。\n\n## 讲深一层\n\n四层职责划分（面试官问\"哪些是你写的\"就按这层讲）：\n\n| 层 | 承担什么 | 关键点 |\n|---|---|---|\n| 驱动层 | DHT11 单总线时序、UART / RS485 收发 | 微秒级延时、GPIO 方向切换、关中断 |\n| 模块层 | DTU 初始化与 AT 指令交互 | 应答匹配 + 超时判据 |\n| 业务层 | 采集 → 解析 → 组帧 → 发送 | 帧格式、校验 |\n| 应用层 | 云端接收、数据展示与曲线 | 时间戳依赖 RTC |\n\n链路串起来是：DHT11 → GPIO → STM32 解析 → 组帧 → RS485 → DTU → 4G → 云。\n\n## 高频追问\n\n1. **为什么用 RS485 不用 TTL 串口？** —— 差分传输抗共模干扰，传输距离可达千米级，设备装在车上或野外走长线更稳。\n2. **Cat.1 和 NB-IoT 怎么选？** —— Cat.1 上下行约 5 / 10 Mbps，适合小数据量但要有一定实时性；NB-IoT 只有百 kbps 级，超低功耗广覆盖，适合抄表这类不需要实时的场景。\n3. **系统怎么确认真的连上云了？** —— DTU 注册到云后服务器会回固定一帧注册包 `0xAF 0x20 0x7E 0x00 0x01 0x5A`，用它作为判据，而不是「发出去了应该成了」。\n4. **你的 RTC 为什么单接纽扣电池？** —— 主电源掉电时维持 RTC 走时和后备寄存器，重启后时间戳不用重设，采集系统没有时间戳等于数据废掉。\n\n## 易错点\n\n- ❌ 说「DHT11 是红外测温传感器」 —— 论文里自己笔误过一处，面试说错是硬伤\n- ✅ 说「复合式数字温湿度传感器：电阻式湿敏元件 + NTC 测温元件，内部集成 8 位单片机做校准和数字输出」\n- ❌ 只讲「采集-上传-显示」不讲难点 —— 听起来像课程实验\n- ✅ 一定要带出「时序严 + 超时判据 + 量程短板」这三件真事\n\n## 关联项目\n\n- `方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf`\n- `方向与规划/项目/毕设/4G道路温度采集_项目包`\n\n## 来源\n\n本人本科毕设（2026）"},{"id":"Q-0102","title":"DHT11 的驱动难点在哪？","module":"01_project","moduleName":"项目深挖","sub":"4G道路测温","priority":"P0","difficulty":3,"status":"answered","qtype":"project","roles":["嵌入式"],"companies":["亿嘉和"],"tags":["DHT11","单总线","时序","GPIO","中断"],"sourceRef":"方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf","html":"<h2>口述答案</h2>\n<blockquote>难点不是读 GPIO，而是准确测出高电平持续了多久。DHT11 一次传 40 位，每一位的 0 和 1 是靠高电平宽度区分的——大约 26 微秒是 0，70 微秒是 1。所以三件事决定驱动稳不稳：微秒级延时的精度、GPIO 在输入和输出之间切换的时机、以及中断会不会打断采样。我的做法是同一个 GPIO 动态切方向，改的是 <code>GPIOG-&gt;CRH</code> 的配置位；读的时候关中断，因为一旦被中断打断，脉宽就测错，整帧数据就废了。而校验和只能告诉你错了，不能告诉你错在哪一位。</blockquote>\n<h2>讲深一层</h2>\n<p>完整时序：</p>\n<table><thead><tr><th>阶段</th><th>时长</th><th>说明</th></tr></thead><tbody><tr><td>主机起始</td><td>拉低 ≥18ms</td><td>唤醒从机</td></tr><tr><td>主机释放</td><td>20–40µs</td><td>切为输入，等响应</td></tr><tr><td>从机响应</td><td>80µs 低 + 80µs 高</td><td>握手成功标志</td></tr><tr><td>数据位 × 40</td><td>每位以 50µs 低电平起始</td><td>高电平 ~26µs = 0，~70µs = 1</td></tr></tbody></table>\n<p>数据格式 40 位 = 5 字节：</p>\n<table><thead><tr><th>字节</th><th>内容</th></tr></thead><tbody><tr><td>1</td><td>湿度整数</td></tr><tr><td>2</td><td>湿度小数（DHT11 恒为 0）</td></tr><tr><td>3</td><td>温度整数</td></tr><tr><td>4</td><td>温度小数（恒为 0）</td></tr><tr><td>5</td><td>校验和 = 前 4 字节相加取低 8 位</td></tr></tbody></table>\n<p>分辨率就是 1℃ / 1%RH，小数位是没有意义的。</p>\n<h2>高频追问</h2>\n<ol><li><strong>为什么必须关中断？</strong> —— 采样窗口是微秒级，中断进出本身的耗时加上服务程序，足以让脉宽判错；错一位整帧作废。</li><li><strong>校验和怎么算？</strong> —— 前四字节相加取低 8 位，与第五字节比较，不等就丢弃重读。</li><li><strong>为什么不能只靠校验和保证正确？</strong> —— 它只能发现错，定位不了错在哪一位；真正的保障是时序精度。</li><li><strong>不上拉电阻行不行？</strong> —— 单总线是开漏结构，没有上拉就没有明确的高电平，读出来全是错的。</li></ol>\n<h2>易错点</h2>\n<ul><li>❌ 「DHT11 精度 ±0.5℃」 —— 实际是 ±2℃</li><li>✅ 记住官方规格：温度 0–50℃ ±2℃、湿度 20–90%RH ±5%RH、响应时间 6s 量级</li><li>❌ 说「就是延时读一下电平」 —— 完全没体现工程难点</li><li>✅ 落到「延时精度 / 方向切换时机 / 中断干扰」这三件事上</li></ul>\n<h2>关联项目</h2>\n<ul><li><code>方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf</code> §5.1、§5.4</li></ul>\n<h2>来源</h2>\n<p>本人本科毕设 + DHT11 数据手册</p>","plain":"## 口述答案\n\n> 难点不是读 GPIO，而是准确测出高电平持续了多久。DHT11 一次传 40 位，\n> 每一位的 0 和 1 是靠高电平宽度区分的——大约 26 微秒是 0，70 微秒是 1。\n> 所以三件事决定驱动稳不稳：微秒级延时的精度、GPIO 在输入和输出之间切换的时机、\n> 以及中断会不会打断采样。我的做法是同一个 GPIO 动态切方向，改的是 `GPIOG->CRH`\n> 的配置位；读的时候关中断，因为一旦被中断打断，脉宽就测错，整帧数据就废了。\n> 而校验和只能告诉你错了，不能告诉你错在哪一位。\n\n## 讲深一层\n\n完整时序：\n\n| 阶段 | 时长 | 说明 |\n|---|---|---|\n| 主机起始 | 拉低 ≥18ms | 唤醒从机 |\n| 主机释放 | 20–40µs | 切为输入，等响应 |\n| 从机响应 | 80µs 低 + 80µs 高 | 握手成功标志 |\n| 数据位 × 40 | 每位以 50µs 低电平起始 | 高电平 ~26µs = 0，~70µs = 1 |\n\n数据格式 40 位 = 5 字节：\n\n| 字节 | 内容 |\n|---|---|\n| 1 | 湿度整数 |\n| 2 | 湿度小数（DHT11 恒为 0） |\n| 3 | 温度整数 |\n| 4 | 温度小数（恒为 0） |\n| 5 | 校验和 = 前 4 字节相加取低 8 位 |\n\n分辨率就是 1℃ / 1%RH，小数位是没有意义的。\n\n## 高频追问\n\n1. **为什么必须关中断？** —— 采样窗口是微秒级，中断进出本身的耗时加上服务程序，足以让脉宽判错；错一位整帧作废。\n2. **校验和怎么算？** —— 前四字节相加取低 8 位，与第五字节比较，不等就丢弃重读。\n3. **为什么不能只靠校验和保证正确？** —— 它只能发现错，定位不了错在哪一位；真正的保障是时序精度。\n4. **不上拉电阻行不行？** —— 单总线是开漏结构，没有上拉就没有明确的高电平，读出来全是错的。\n\n## 易错点\n\n- ❌ 「DHT11 精度 ±0.5℃」 —— 实际是 ±2℃\n- ✅ 记住官方规格：温度 0–50℃ ±2℃、湿度 20–90%RH ±5%RH、响应时间 6s 量级\n- ❌ 说「就是延时读一下电平」 —— 完全没体现工程难点\n- ✅ 落到「延时精度 / 方向切换时机 / 中断干扰」这三件事上\n\n## 关联项目\n\n- `方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf` §5.1、§5.4\n\n## 来源\n\n本人本科毕设 + DHT11 数据手册"},{"id":"Q-0103","title":"你这个方案的局限是什么？为什么用 DHT11 而不是红外测温？","module":"01_project","moduleName":"项目深挖","sub":"4G道路测温","priority":"P0","difficulty":3,"status":"answered","qtype":"project","roles":["嵌入式","感知"],"companies":["亿嘉和","华为车BU"],"tags":["DHT11","红外测温","量程","方案取舍","局限"],"sourceRef":"方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf","html":"<h2>口述答案</h2>\n<blockquote>这是我这个设计最明确的局限，我绪论里分析过两类路面测温方式：接触式要埋设、会破坏路面；非接触红外精度高但成本上去了。本科阶段的可控条件下，我选了 DHT11 做近地表接触测量，把项目重心放在验证「采集—4G—云端」这条链路的可行性上，而不是做一个精度达标的测温仪器。所以论文题目是「获取方法」，落脚点是链路可行性，这一点我在结论里也写明了。如果要继续做，路径是清楚的：换成红外测温模块或埋热电偶，补上标准仪器比对来量化误差，并且解决 50℃ 以上的量程问题。</blockquote>\n<h2>讲深一层</h2>\n<p>三种路面测温方式对比：</p>\n<table><thead><tr><th>方式</th><th>代表器件</th><th>精度</th><th>成本</th><th>主要问题</th></tr></thead><tbody><tr><td>接触式（本方案）</td><td>DHT11</td><td>±2℃</td><td>极低</td><td><strong>量程 0–50℃，超了直接测不了</strong>；需近地表安装</td></tr><tr><td>非接触红外</td><td>红外测温模块</td><td>较高</td><td>中高</td><td>受发射率、环境辐射影响，要标定</td></tr><tr><td>埋入式</td><td>热电偶</td><td>高</td><td>中</td><td>需埋设，破坏路面，施工成本高</td></tr></tbody></table>\n<p>关键矛盾：<strong>夏季沥青路面可到 60℃ 以上，已超出 DHT11 的 0–50℃ 量程</strong>。这不是精度问题，是测不到。</p>\n<h2>高频追问</h2>\n<ol><li><strong>那你这数据能用来干嘛？</strong> —— 诚实的答法：能做趋势观测和链路验证，不能做标定级测量。别硬吹。</li><li><strong>如果给你三个月改进，你先做什么？</strong> —— 先解决量程（换红外或热电偶），再做标准仪器比对量化误差，最后才谈精度优化。</li><li><strong>为什么不一开始就用红外？</strong> —— 成本 + 标定门槛。本科阶段的可控条件下，先用低成本方案把链路打通，是合理取舍。</li><li><strong>你怎么知道误差有多大？</strong> —— 本方案没有做标准仪器比对，这是局限；正确做法是并排测同一路面，做误差统计。</li></ol>\n<h2>易错点</h2>\n<ul><li>❌ 硬说「精度够用」 —— 面试官一算 60℃ 就超量程，立刻崩</li><li>✅ 主动承认边界 + 给出改进路径，这是加分项不是减分项</li><li>❌ 把「测不到」说成「测得不准」 —— 量程和精度是两个问题</li><li>✅ 分清：0–50℃ 之内误差 ±2℃（精度问题），超过 50℃ 是量程问题（根本测不了）</li></ul>\n<h2>关联项目</h2>\n<ul><li><code>方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf</code> §7</li><li><code>方向与规划/项目/毕设/4G道路温度采集_项目包</code></li></ul>\n<h2>来源</h2>\n<p>本人本科毕设（2026）</p>","plain":"## 口述答案\n\n> 这是我这个设计最明确的局限，我绪论里分析过两类路面测温方式：接触式要埋设、\n> 会破坏路面；非接触红外精度高但成本上去了。本科阶段的可控条件下，我选了 DHT11\n> 做近地表接触测量，把项目重心放在验证「采集—4G—云端」这条链路的可行性上，\n> 而不是做一个精度达标的测温仪器。所以论文题目是「获取方法」，落脚点是链路可行性，\n> 这一点我在结论里也写明了。如果要继续做，路径是清楚的：换成红外测温模块或埋热电偶，\n> 补上标准仪器比对来量化误差，并且解决 50℃ 以上的量程问题。\n\n## 讲深一层\n\n三种路面测温方式对比：\n\n| 方式 | 代表器件 | 精度 | 成本 | 主要问题 |\n|---|---|---|---|---|\n| 接触式（本方案） | DHT11 | ±2℃ | 极低 | **量程 0–50℃，超了直接测不了**；需近地表安装 |\n| 非接触红外 | 红外测温模块 | 较高 | 中高 | 受发射率、环境辐射影响，要标定 |\n| 埋入式 | 热电偶 | 高 | 中 | 需埋设，破坏路面，施工成本高 |\n\n关键矛盾：**夏季沥青路面可到 60℃ 以上，已超出 DHT11 的 0–50℃ 量程**。这不是精度问题，是测不到。\n\n## 高频追问\n\n1. **那你这数据能用来干嘛？** —— 诚实的答法：能做趋势观测和链路验证，不能做标定级测量。别硬吹。\n2. **如果给你三个月改进，你先做什么？** —— 先解决量程（换红外或热电偶），再做标准仪器比对量化误差，最后才谈精度优化。\n3. **为什么不一开始就用红外？** —— 成本 + 标定门槛。本科阶段的可控条件下，先用低成本方案把链路打通，是合理取舍。\n4. **你怎么知道误差有多大？** —— 本方案没有做标准仪器比对，这是局限；正确做法是并排测同一路面，做误差统计。\n\n## 易错点\n\n- ❌ 硬说「精度够用」 —— 面试官一算 60℃ 就超量程，立刻崩\n- ✅ 主动承认边界 + 给出改进路径，这是加分项不是减分项\n- ❌ 把「测不到」说成「测得不准」 —— 量程和精度是两个问题\n- ✅ 分清：0–50℃ 之内误差 ±2℃（精度问题），超过 50℃ 是量程问题（根本测不了）\n\n## 关联项目\n\n- `方向与规划/项目/毕设/本科毕设_面试口述稿与专业问答_完整版.pdf` §7\n- `方向与规划/项目/毕设/4G道路温度采集_项目包`\n\n## 来源\n\n本人本科毕设（2026）"},{"id":"Q-0104","title":"多边形转矩形框：为什么能转、丢了什么？","module":"01_project","moduleName":"项目深挖","sub":"YOLO部署","priority":"P0","difficulty":2,"status":"indexed","qtype":"principle","roles":[],"companies":[],"tags":[],"sourceRef":"方向与规划/项目/YOLO_Road_Detection/YOLO_Road_Detection_完整手册.html","html":"<h2>口述答案</h2>\n<blockquote>待补充。200–320 字，口语，结构：结论 → 为什么 → 落到\"我做过\"。</blockquote>\n<h2>讲深一层</h2>\n<p>待补充。</p>\n<h2>高频追问</h2>\n<p>待补充。</p>\n<h2>易错点</h2>\n<p>待补充。</p>\n<h2>关联项目</h2>\n<p>待补充。</p>\n<h2>来源</h2>\n<p><code>方向与规划/项目/YOLO_Road_Detection/YOLO_Road_Detection_完整手册.html</code></p>","plain":"## 口述答案\n\n> const WRONG_KEY = 'ib_wrong_v1';
const OPEN_ALL = location.hash === '#all';   // 调试用：全部展开
let wrong = new Set(JSON.parse(localStorage.getItem(WRONG_KEY) || '[]'));

const $ = id => document.getElementById(id);
const list = $('list');

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function card(q){
  const isW = wrong.has(q.id);
  const st = q.status === 'indexed' ? '<span class="tag">待补充</span>' : '';
  return `<article class="q" data-id="${q.id}">
    <div class="qh">
      <span class="pid">${q.id}</span>
      <span class="pri ${q.priority}">${q.priority}</span>
      <div class="qt">${esc(q.title)}</div>
      <span class="tag">${esc(q.moduleName)}</span>
      ${st}
      <button class="wrongmark ${isW?'on':''}" data-w="${q.id}">${isW?'已标错':'标错'}</button>
    </div>
    <div class="body">${q.html}</div>
  </article>`;
}

function render(){
  const kw = $('q').value.trim().toLowerCase();
  const mod = $('mod').value, pri = $('pri').value, st = $('st').value;
  const onlyW = $('wrong').checked;
  const hit = DATA.filter(q => {
    if (mod && q.module !== mod) return false;
    if (pri && q.priority !== pri) return false;
    if (st && q.status !== st) return false;
    if (onlyW && !wrong.has(q.id)) return false;
    if (!kw) return true;
    const hay = (q.title + ' ' + q.id + ' ' + q.tags.join(' ') +
                 ' ' + q.sub + ' ' + q.plain).toLowerCase();
    return hay.includes(kw);
  });
  list.innerHTML = hit.map(card).join('');
  $('empty').style.display = hit.length ? 'none' : 'block';
  // 搜索/筛选时自动展开，省一次点击
  if (kw || mod || pri || st || onlyW || OPEN_ALL) {
    list.querySelectorAll('.q').forEach(el => el.classList.add('open'));
  }
  $('stat').textContent = `共 ${DATA.length} 题 ｜ 当前 ${hit.length} 题 ｜ `
    + `已答 ${DATA.filter(q=>q.status!=='indexed').length} ｜ 错题 ${wrong.size}`;
}

list.addEventListener('click', e => {
  const wb = e.target.closest('[data-w]');
  if (wb) {
    const id = wb.dataset.w;
    wrong.has(id) ? wrong.delete(id) : wrong.add(id);
    localStorage.setItem(WRONG_KEY, JSON.stringify([...wrong]));
    wb.classList.toggle('on');
    wb.textContent = wrong.has(id) ? '已标错' : '标错';
    $('stat').textContent = $('stat').textContent.replace(/错题 \d+/, '错题 ' + wrong.size);
    return;
  }
  const head = e.target.closest('.qh');
  if (head) head.parentElement.classList.toggle('open');
});

['q','mod','pri','st','wrong'].forEach(id => $(id).addEventListener('input', render));
render();
</script>
</body>
</html>
